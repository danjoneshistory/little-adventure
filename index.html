<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   EDIT YOUR HUNT HERE
   Each place:
     soon     - true = tile shows "Coming Soon", faded, can't be opened yet.
                Delete "soon: true," to reveal a place.
     name     - shown on the tile (keep it short)
     icon     - climb, mountain, art, bag, book, giraffe, trees, coffee,
                duck, guitar, koi, beach, lighthouse, bridge, candy, market, mystery-spot,
                teapot, arch, gift, star
     lat/lng  - location; radius = how close (metres) to unlock
     puzzle   - shown once they arrive (line breaks are kept)
     answers  - accepted answers; case, spaces and punctuation are ignored
     prize    - shown when they solve it (optional: leave it out and they just get the heart)
     piece    - their piece of the final puzzle: one letter of FAITH HOPE LOVE,
                shown on the heart they win
     about    - optional short description of the place, shown before they check in
     intro    - optional page shown before the puzzle: { sections: [{heading, text}], button }
     photo    - optional photo step before the puzzle: { heading, text }
     game     - optional: replaces the answer box with a game. Connections:
                { type: "connections", groups: [ { theme, words: [4 words], color } x4 ] }
                color is yellow, green, blue or purple (easiest to hardest).
                Strands:
                { type: "strands", theme, hints, rows: [letter rows],
                  words: [ { word, path: [cell numbers], spangram: true? } ] }
                Cells are numbered left to right, top to bottom, starting at 0.
                The grid comes from a layout script, so ask Claude to make a new one.
                Mini crossword:
                { type: "crossword", title, rows: ["CUTE.", ...], across: { 1: "clue", ... }, down: { 2: "clue", ... } }
                Each row is the answer letters, with . for a black square. Clue numbers
                are worked out from the grid the usual way.
     choices  - optional: instead of one lat/lng, a list of spots to pick from.
                Each spot gets its own screen and its own puzzle / answers / prize.
                They can switch between spots any time; solving any one earns the piece.
                Each spot can have its own icon. choiceLayout: "tiles" shows the
                spots as picture tiles instead of a list.
                greeting: optional message above the spots (until they earn the piece).
   finalPuzzle:
     prompt   - shown once all 13 pieces are collected
     answers  - leave [] to reveal the big thing right away,
                or add answers to make them solve the final puzzle too
     reveal   - the big thing
   ===================================================================== */
const HUNT = {
  title: "A Little Adventure",
  intro: "Thirteen places, thirteen puzzles, thirteen pieces. Visit each spot, solve its puzzle, and collect a piece of the big surprise.",
  // The cloud that greets them on their first visit (until they tick "Don't show this again").
  welcome: {
    title: "Welcome to your Little Adventure!",
    paragraphs: [
      "Here’s something to keep you busy while we’re apart, as we wait for our big adventure.",
      "Over the next few months, you’ll be solving a puzzle that takes you across the United States and all around Salt Lake City.",
      "But the journey is the destination. This little adventure is about taking time, taking stock, enjoying our memories, and planning new ones."
    ],
    button: "Let’s begin!",
    dontShow: "Don’t show this again"
  },
  finalPuzzle: {
    prompt: "Unscramble the letters on your 13 hearts to find three words.",
    // FAITH HOPE LOVE, accepted in any order, with or without "and"
    answers: ["faith hope love", "faith hope and love", "faith love hope", "hope faith love",
              "hope love faith", "love faith hope", "love hope faith"],
    reveal: "THE BIG THING GOES HERE"
  },
  showDistance: true,
  places: [
    { name: "Beachwood",          icon: "lighthouse", choiceLayout: "tiles",
      greeting: "For this adventure, you’ll be traveling to Beachwood, Ohio. But there are three options. You don’t have to do them all to complete the puzzle, just one. But you can do them all if you wish. Feel free to look at each one and choose the one that you want.",
      choices: [
        { name: "Pooh Sticks Bridge",      icon: "bridge", lat: 41.46919, lng: -81.46169, radius: 60,
          about: "A little footbridge over a stream, just right for a game of Poohsticks. Keep an eye out for good sticks on your way!",
          intro: {
            sections: [
              { text: "One of the most wonderful things about us has been playing games. And spontaneous games are the best! I’ll never forget you running through the zoo, or playing Connections together in a coffee shop to settle our nerves. If we crossed this bridge together, and someday we will cross this bridge together, we’ll play Pooh Sticks." },
              { heading: "Where the game comes from",
                text: "Poohsticks was invented by Winnie-the-Pooh himself, in A. A. Milne’s book The House at Pooh Corner (1928). Pooh is crossing a bridge with a fir cone when he trips and drops it into the stream. He watches it float under the bridge and pop out the other side, and a new game is born. Fir cones are hard to tell apart, so sticks soon took their place.\n\nMilne based the bridge on a real wooden footbridge in Ashdown Forest, England, where people still come to play. There’s even a World Poohsticks Championship, first held in 1984." },
              { heading: "How to play",
                text: "1. Find two sticks, different enough that you can tell them apart, and pick the one you’re cheering for.\n2. Stand on the side of the bridge where the water flows in toward you.\n3. Hold both sticks out at the same height and drop them at the same time on “Ready, steady, go!” Drop, don’t throw.\n4. Hurry to the other side. The first stick to float out wins!" },
              { heading: "Your turn",
                text: "Play at least one round. Best of three if it’s close! Then tap the button below." }
            ],
            button: "I played!"
          },
          photo: {
            heading: "Picture time!",
            text: "Take a picture of yourself on the bridge and submit it to open your puzzle."
          },
          puzzle: "Find four groups of four related words.",
          game: {
            type: "connections",
            groups: [
              { theme: "Pet names",          words: ["HONEYBEE", "B", "BABE", "DARLING"],     color: "yellow" },
              { theme: "___STICK",           words: ["LIP", "DRUM", "CHOP", "JOY"],           color: "green" },
              { theme: "Things that float",  words: ["CORK", "RAFT", "BUOY", "LEAF"],          color: "blue" },
              { theme: "Things with a bridge", words: ["NOSE", "TEETH", "VIOLIN", "GLASSES"], color: "purple" }
            ]
          } },
        { name: "b.a. Sweetie Candy",      icon: "candy",  lat: 41.42015, lng: -81.73167, radius: 120,
          about: "A huge, old-fashioned candy store packed with sweets of every kind, from candy you remember from childhood to treats you’ve never heard of.",
          intro: {
            sections: [
              { heading: "Your candy hunt",
                text: "Wander the aisles and find four candies:\n\n1. One that would be nice to share together.\n2. One that reminds you of me, or of us.\n3. One you’ve never seen before but want us to try.\n4. Bonus point: something Canadian! 🍁" },
              { heading: "Your turn",
                text: "Take your time and have fun looking. Once you’ve found all four (or three, if Canada is hiding), tap the button below." }
            ],
            button: "I found my candy!"
          },
          photo: {
            heading: "Picture time!",
            text: "Line up your candies and take a picture of them to open your puzzle."
          },
          puzzle: "Find the candies hidden in the letters. Drag through letters that touch (sideways, up, down or diagonally), or tap them one at a time and tap the last letter again to check. One special word stretches all the way across the board. Every letter gets used!",
          game: {
            type: "strands",
            theme: "Sweet on you",
            hints: 3,
            rows: ["FDGICEC",
                   "URETMAR",
                   "TAHEEWE",
                   "SYEYATS",
                   "RBMFFYL",
                   "AEGMEFA",
                   "ILUHCTF",
                   "MKCOOLA"],
            words: [
              { word: "SWEETHEART",    path: [27,19,18,17,10,16,23,15,8,14], spangram: true },
              { word: "FUDGE",         path: [0,7,1,2,9] },
              { word: "ICECREAM",      path: [3,4,5,6,13,20,12,11] },
              { word: "GUMMYBEARS",    path: [37,44,38,30,22,29,36,35,28,21] },
              { word: "LAFFYTAFFY",    path: [34,41,48,40,33,26,25,31,32,24] },
              { word: "MILKCHOCOLATE", path: [49,42,43,50,51,45,52,46,53,54,55,47,39] }
            ]
          } },
        { name: "Fall Craft Market",       icon: "market", lat: 41.49852, lng: -81.49424, radius: 250,
          about: "A seasonal market full of booths from local makers, with handmade gifts, art, treats and cozy fall finds.",
          intro: {
            sections: [
              { heading: "Your market mission",
                text: "Wander the booths and find one thing that reminds you of us. It could be something we’d both love, something that brings back a memory, or something that just makes you smile and think of me." },
              { heading: "Your turn",
                text: "Take your time looking. When you’ve found it, tap the button below." }
            ],
            button: "Found it!"
          },
          photo: {
            heading: "Picture time!",
            text: "Take a picture of yourself with the thing that reminds you of us to open your puzzle."
          },
          puzzle: "Solve the mini crossword! Tap a square to start typing, and tap it again to switch between Across and Down. You can also tap a clue to jump to it.",
          game: {
            type: "crossword",
            title: "OK Then",
            rows: ["CUTE.",
                   ".BUTT",
                   "MANIA",
                   "CHALK",
                   "UNSEE"],
            across: {
              1: "With 5A, one of your noticeable features",
              5: "See 1A",
              7: "Craze, as in how I feel about you",
              8: "Powder for bouldering together",
              9: "Wipe from one’s visual memory, so to speak"
            },
            down: {
              2: "Subway system in Berlin, which we’ll ride together someday",
              3: "Choices for sushi chefs",
              4: "One of twelve in a Scrabble set",
              6: "“______ me, I’m yours!”",
              7: "Superhero franchise in which Steve Rogers falls in love with Peggy Carter (abbr.)"
            }
          } }
      ],
      piece: "P" },
    { name: "Belmont",            icon: "koi",      lat: 37.56199, lng: -122.32197, radius: 80,  puzzle: "PUZZLE 11", answers: ["answer11"], prize: "PRIZE 11", piece: "L" },
    { name: "Santa Cruz",         icon: "beach", choiceLayout: "tiles",
      choices: [
        { name: "Mystery Spot",           icon: "mystery-spot", lat: 37.01723, lng: -122.00293, radius: 150,
          about: "A patch of redwood forest in the hills above Santa Cruz where balls seem to roll uphill and people seem to change height. Is it gravity, or is it a trick? You decide.",
          puzzle: "MYSTERY SPOT PUZZLE", answers: ["mysteryanswer"], prize: "MYSTERY SPOT PRIZE" },
        { name: "Hidden Peak Teahouse",   icon: "teapot",       lat: 36.97603, lng: -122.02721, radius: 60,
          about: "A cozy teahouse in Santa Cruz, the perfect place to slow down over a pot of tea.",
          puzzle: "TEAHOUSE PUZZLE", answers: ["teaanswer"], prize: "TEAHOUSE PRIZE" },
        { name: "Hole in the Wall Beach", icon: "arch",         lat: 36.99100, lng: -122.16890, radius: 300,
          about: "A hidden beach on the coast north of Santa Cruz, named for the tunnel worn through its cliffs. Check the tide before you go!",
          puzzle: "BEACH PUZZLE", answers: ["beachanswer"], prize: "BEACH PRIZE" }
      ],
      piece: "A" },
    { soon: true, name: "Bouldering Project", icon: "climb",    lat: 40.75496, lng: -111.90308, radius: 75,  puzzle: "PUZZLE 1",  answers: ["answer1"],  prize: "PRIZE 1",  piece: "E" },
    { soon: true, name: "H Rock",             icon: "mountain", lat: 40.73055, lng: -111.81129, radius: 80,  puzzle: "PUZZLE 2",  answers: ["answer2"],  prize: "PRIZE 2",  piece: "T" },
    { soon: true, name: "UMFA",               icon: "art",      lat: 40.76046, lng: -111.84331, radius: 90,  puzzle: "PUZZLE 3",  answers: ["answer3"],  prize: "PRIZE 3",  piece: "O" },
    { soon: true, name: "Savers",             icon: "bag",      lat: 40.70105, lng: -111.80381, radius: 90,  puzzle: "PUZZLE 4",  answers: ["answer4"],  prize: "PRIZE 4",  piece: "H" },
    { soon: true, name: "City Library",       icon: "book",     lat: 40.76004, lng: -111.88461, radius: 90,  puzzle: "PUZZLE 5",  answers: ["answer5"],  prize: "PRIZE 5",  piece: "V" },
    { soon: true, name: "Hogle Zoo",          icon: "giraffe",  lat: 40.75037, lng: -111.81417, radius: 250, puzzle: "PUZZLE 6",  answers: ["answer6"],  prize: "PRIZE 6",  piece: "I" },
    { soon: true, name: "Wasatch Hollow",     icon: "trees",    lat: 40.73449, lng: -111.84399, radius: 150, puzzle: "PUZZLE 7",  answers: ["answer7"],  prize: "PRIZE 7",  piece: "E" },
    { soon: true, name: "Loki Coffee",        icon: "coffee",   lat: 40.75015, lng: -111.88152, radius: 60,  puzzle: "PUZZLE 8",  answers: ["answer8"],  prize: "PRIZE 8",  piece: "F" },
    { soon: true, name: "Sugar House Park",   icon: "duck",     lat: 40.72388, lng: -111.84940, radius: 400, puzzle: "PUZZLE 9",  answers: ["answer9"],  prize: "PRIZE 9",  piece: "O" },
    { soon: true, name: "Guitar Center",      icon: "guitar",   lat: 40.64678, lng: -111.94265, radius: 90,  puzzle: "PUZZLE 10", answers: ["answer10"], prize: "PRIZE 10", piece: "H" }
  ]
};
</script>
<style>
:root{
  --bg:#FFF5F9; --card:#FFFFFF; --ink:#3A2140; --muted:#7B6280; --line:#F3DCE7;
  --pink:#FF8FB8; --lilac:#C4B0FF; --mint:#8FDFC5; --butter:#FFDB75; --sky:#9DD2FF; --peach:#FFB894;
  --heart:#FF4F8B; --ok:#1F9D6E; --warn:#D9466F;
  --tile-ink:#3A2140; --shadow:0 6px 0 #F3DCE7;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#241629; --card:#33213B; --ink:#FDEFF6; --muted:#C8AFC9; --line:#4A3253;
    --heart:#FF79A6; --ok:#7EE2B8; --warn:#FF8FB0; --shadow:0 6px 0 #1A0F1E;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:17px/1.55 "Nunito", ui-rounded, system-ui, -apple-system, sans-serif; font-weight:500;
  -webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--pink) 22%, transparent) 0 120px, transparent 121px),
                   radial-gradient(circle at 95% 30%, color-mix(in srgb, var(--lilac) 20%, transparent) 0 90px, transparent 91px);
  background-attachment:fixed;
}
main{max-width:34rem; margin:0 auto; padding:1rem 1.1rem 3rem}
.display{font-family:"Fredoka", ui-rounded, system-ui, sans-serif}

/* Header */
.hero{text-align:center; padding-top:.5rem}
.hero svg{width:min(220px,60vw); height:auto; display:block; margin:0 auto}
.hero h1{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:2.3rem; line-height:1.05; margin:.4rem 0 .5rem; color:var(--ink)}
.hero p{color:var(--muted); margin:0 auto 1.25rem; max-width:28rem}
.meter{display:flex; justify-content:center; gap:3px; margin:0 0 1.25rem; flex-wrap:wrap}
.meter svg{width:20px; height:20px}

/* Grid */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem}
.grid > .tile:last-child:nth-child(3n+1){grid-column:2}
.tile{
  position:relative; aspect-ratio:1/1.12; border:0; border-radius:22px; padding:.5rem .4rem .55rem; margin:0;
  font:inherit; color:var(--tile-ink); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center;
  box-shadow:0 5px 0 color-mix(in srgb, var(--c) 60%, #3A2140);
  background:var(--c); transition:transform .15s ease;
}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.tile .ic{width:66%; flex:1; display:flex; align-items:center; justify-content:center}
.tile .ic svg{width:100%; height:auto; max-height:100%}
.tile .nm{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:.82rem; line-height:1.1}
.tile.soon{opacity:.5; filter:saturate(.55); cursor:default; box-shadow:0 5px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.tile.soon:active{transform:none}
.tile .tag{
  position:absolute; top:-6px; right:-4px; background:var(--card); color:var(--ink);
  font-size:.68rem; font-weight:800; padding:.1rem .45rem; border-radius:999px; border:2px solid var(--c);
}
.tile .check{position:absolute; top:-8px; left:-8px; width:26px; height:26px; border-radius:50%;
  background:#1F9D6E; color:#fff; border:2px solid #fff; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.85rem; line-height:1; box-shadow:0 2px 0 rgba(58,33,64,.25)}
.tile .badge{position:absolute; top:-10px; right:-8px; width:40px; height:40px}
.tile .badge svg{width:100%; height:100%}
.tile .badge span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:3px;
  color:#fff; font-family:"Fredoka", sans-serif; font-weight:700; font-size:.85rem}

/* Final */
.final{margin-top:2rem; background:var(--card); border-radius:26px; padding:1.3rem 1.1rem 1.4rem; box-shadow:var(--shadow); text-align:center; border:2px solid var(--line)}
.final h2{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.45rem; margin:0}
.final .sub{color:var(--muted); margin:.25rem 0 1rem; white-space:pre-line}
.slots{display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem}
.slot{position:relative; aspect-ratio:1; min-width:0}
.slot svg, .meter svg{display:block}
.slot svg{width:100%; height:100%}
.slot span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:12%;
  font-family:"Fredoka", sans-serif; font-weight:700; font-size:.9rem; color:#fff; word-break:break-word; line-height:1}
.big{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1.5rem; line-height:1.3; white-space:pre-line; margin:1.1rem 0 0; color:var(--heart)}

/* Place view */
.back{font:inherit; font-weight:800; background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:.4rem .9rem; cursor:pointer}
.phead{text-align:center; margin-top:1rem}
.bubble{width:150px; height:150px; border-radius:50%; background:var(--c); margin:0 auto; display:flex; align-items:center; justify-content:center;
  box-shadow:0 7px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.bubble svg{width:62%; height:auto}
.phead h1{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:2rem; margin:1rem 0 0; line-height:1.1}
.card{background:var(--card); border-radius:24px; padding:1.25rem 1.15rem; margin-top:1.1rem; box-shadow:var(--shadow); border:2px solid var(--line)}
.card h2{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1rem; color:var(--heart); margin:0 0 .4rem}
.text{font-size:1.2rem; line-height:1.45; white-space:pre-line; margin:0; font-weight:700}
.reveal{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none}}

button.primary{
  font:inherit; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1.1rem;
  width:100%; border:0; border-radius:18px; padding:.95rem; margin-top:1.1rem; cursor:pointer;
  background:var(--heart); color:#fff; box-shadow:0 5px 0 color-mix(in srgb, var(--heart) 60%, #3A2140);
}
button.primary:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--heart) 60%, #3A2140)}
button.primary:disabled{opacity:.6}
button.ghost{font:inherit; width:100%; background:transparent; color:var(--muted); border:2px dashed var(--line); border-radius:16px; padding:.75rem; margin-top:.7rem; cursor:pointer}
input[type=text]{
  font:inherit; font-weight:700; width:100%; margin-top:1rem; padding:.85rem 1rem; border-radius:16px;
  border:2px solid var(--line); background:var(--bg); color:var(--ink);
}
input[type=text]:focus{border-color:var(--heart); outline:none}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.status{min-height:1.5rem; margin:.8rem 0 0; color:var(--muted); font-weight:700}
.dirsLabel{margin:.9rem 0 .4rem; font-size:.8rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.dirs{display:flex; gap:.5rem}
.dirs a{flex:1; display:flex; align-items:center; justify-content:center; gap:.4rem; padding:.6rem .5rem; border-radius:999px;
  border:2px solid var(--line); background:var(--bg); color:var(--ink); font-weight:800; font-size:.92rem; text-decoration:none}
.dirs a:active{transform:translateY(1px)}
.dirs svg{width:16px; height:16px; flex:none}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.prizeCard{text-align:center}
.choices{list-style:none; padding:0; margin:1rem 0 0; display:grid; gap:.5rem}
.choiceBtn{font:inherit; font-weight:800; font-size:1.05rem; color:var(--ink); width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:.65rem; background:var(--bg); border:2px solid var(--line); border-radius:18px; padding:.9rem 1rem;
  box-shadow:0 4px 0 var(--line)}
.choiceBtn::after{content:"›"; margin-left:auto; font-size:1.4rem; line-height:1; color:var(--heart)}
.choiceBtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.choiceBtn::before{content:""; width:14px; height:13px; flex:none; background:var(--heart);
  clip-path:path("M7 13 C2 9.5 0 7 0.6 4.4 C1.2 1.6 4.6 1 7 3.6 C9.4 1 12.8 1.6 13.4 4.4 C14 7 12 9.5 7 13 Z")}
.choiceGrid{margin-top:1.3rem}
.cx{margin-top:1rem}
.cxSolved{display:grid; gap:.45rem; margin-bottom:.45rem}
.cxGroup{border-radius:16px; padding:.75rem .5rem; text-align:center; color:var(--tile-ink); animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.cxGroup strong{display:block; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.04em; font-size:.95rem}
.cxGroup span{font-size:.85rem; font-weight:700; overflow-wrap:anywhere}
.cxGrid{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:.4rem}
.cxWord{font:inherit; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:clamp(.66rem, 2.9vw, .92rem); line-height:1.15;
  min-height:62px; padding:.3rem .2rem; border-radius:14px; border:2px solid var(--line); background:var(--bg); color:var(--ink);
  cursor:pointer; overflow-wrap:anywhere; touch-action:manipulation; box-shadow:0 3px 0 var(--line)}
.cxWord.sel{background:var(--ink); color:var(--card); border-color:var(--ink); box-shadow:0 3px 0 color-mix(in srgb, var(--ink) 60%, #000)}
.cxWord:disabled{cursor:default}
.cxLives{display:flex; align-items:center; justify-content:center; gap:.5rem; margin:.9rem 0 .2rem; color:var(--muted); font-weight:700; font-size:.9rem}
.cxHearts{display:flex; gap:3px}.cxHearts svg{width:20px; height:20px; display:block}
.cxCtr{display:grid; grid-template-columns:1fr 1fr; gap:.5rem; margin-top:.6rem}
.cxBtn{font:inherit; font-weight:800; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:999px; padding:.65rem; cursor:pointer}
.cxBtn:disabled, .primary:disabled{opacity:.45; cursor:default}
.shake{animation:shake .38s ease}

/* Mini crossword */
.xw{margin-top:1rem; position:relative}
.xwTitle{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.05rem; text-align:center; margin:0 0 .5rem; color:var(--muted)}
.xwBar{display:flex; align-items:stretch; gap:.3rem; background:var(--sky); color:var(--tile-ink); border-radius:14px; padding:.3rem; margin-bottom:.6rem; min-height:3.6rem}
.xwBar button{font:inherit; font-weight:800; font-size:1.3rem; line-height:1; border:0; background:transparent; color:inherit; padding:0 .45rem; cursor:pointer; border-radius:10px}
.xwBar p{flex:1; margin:0; display:flex; align-items:center; gap:.45rem; font-weight:700; font-size:.95rem; line-height:1.25; padding:.2rem 0}
.xwBar b{font-family:"Fredoka", ui-rounded, sans-serif; white-space:nowrap}
.xwGrid{display:grid; gap:0; border:2.5px solid var(--ink); border-radius:6px; overflow:hidden; max-width:330px; margin:0 auto; background:var(--ink);
  user-select:none; -webkit-user-select:none}
.xwCell{position:relative; aspect-ratio:1; background:#fff; border:.5px solid #B9A6BD; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:clamp(1.3rem, 8vw, 1.9rem); color:#3A2140; -webkit-tap-highlight-color:transparent}
.xwCell.blk{background:#3A2140; cursor:default}
.xwCell.word{background:#D7ECFF}
.xwCell.cur{background:#FFDB75}
.xwCell.wrong{color:#D9466F}
.xwCell.wrong::after{content:""; position:absolute; left:15%; right:15%; top:50%; border-top:2px solid #D9466F; transform:rotate(-30deg)}
.xwCell.done{background:#C9F0E1}
.xwCell small{position:absolute; top:2px; left:4px; font-family:"Nunito", sans-serif; font-size:.62rem; font-weight:800; line-height:1; color:#3A2140}
.xwInput{position:absolute; opacity:0; left:0; top:0; width:1px; height:1px; font-size:16px; border:0; padding:0; pointer-events:none}
.xwClues{display:grid; grid-template-columns:1fr; gap:.8rem; margin-top:1rem; text-align:left}
.xwClues h3{font-family:"Fredoka", ui-rounded, sans-serif; font-size:.85rem; letter-spacing:.07em; text-transform:uppercase; color:var(--heart); margin:0 0 .3rem}
.xwClues ol{list-style:none; margin:0; padding:0; display:grid; gap:.15rem}
.xwClue{font:inherit; width:100%; text-align:left; display:flex; gap:.5rem; background:transparent; border:0; border-radius:10px; padding:.35rem .5rem; color:var(--ink); cursor:pointer; line-height:1.3}
.xwClue b{min-width:1.3rem}
.xwClue.on{background:color-mix(in srgb, var(--sky) 45%, transparent)}
.xwClue.filled{color:var(--muted)}
.xwBtns{display:flex; gap:.5rem; justify-content:center; margin-top:.9rem}
.xwBtns .cxBtn{flex:1; max-width:10rem}

/* Strands */
.st{margin-top:1rem; text-align:center}
.stTheme{background:var(--sky); color:var(--tile-ink); border-radius:16px; padding:.5rem .75rem; margin-bottom:.4rem}
.stTheme span{display:block; font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.07em}
.stTheme strong{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.2rem}
.stWord{min-height:1.9rem; margin:.3rem 0; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:.08em; color:var(--ink)}
.stWord.ok{color:var(--ok)} .stWord.warn{color:var(--warn); font-size:1rem; letter-spacing:0}
.stBoard{position:relative; display:grid; grid-template-columns:repeat(var(--cols), minmax(0,1fr)); gap:3px; max-width:360px; margin:0 auto;
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.stLines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0}
.stCell{position:relative; z-index:1; aspect-ratio:1; width:100%; padding:0; border:0; border-radius:50%; background:transparent; cursor:pointer;
  font:inherit; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:clamp(1rem, 5.2vw, 1.35rem); color:var(--ink);
  -webkit-tap-highlight-color:transparent; touch-action:none}
.stCell.sel{background:var(--ink); color:var(--card)}
.stCell.found{background:var(--sky); color:var(--tile-ink); cursor:default}
.stCell.span{background:var(--butter); color:var(--tile-ink); cursor:default}
.stCell.hint{outline:2.5px dashed var(--heart); outline-offset:-3px}
.stProg{color:var(--muted); font-weight:700; margin:.8rem 0 .5rem}
.stBtns{display:flex; justify-content:center}
.stBtns .cxBtn{min-width:9rem}
.cxBtn:disabled{opacity:.45; cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)}}
.pop{animation:pop .35s ease}
.text.body{font-weight:600; font-size:1.05rem; line-height:1.55}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.drop{display:flex; flex-direction:column; align-items:center; gap:.4rem; margin-top:1rem; padding:1.4rem 1rem; border:3px dashed var(--line);
  border-radius:20px; background:var(--bg); cursor:pointer; font-weight:800; color:var(--muted); text-align:center}
.drop .cam{width:76px}
.drop[hidden], .preview[hidden], .again[hidden], button[hidden]{display:none}
.preview{display:block; width:100%; margin-top:1rem; border-radius:18px; border:4px solid #fff; box-shadow:0 4px 0 var(--line); transform:rotate(-1.5deg)}
.preview.keep{margin:0 0 1.2rem}
label.ghost{display:block; text-align:center; color:var(--muted); border:2px dashed var(--line); border-radius:16px; padding:.75rem; margin-top:.7rem; cursor:pointer}
#photoIn:focus-visible + .drop{outline:3px solid var(--ink); outline-offset:3px}
.choiceNote{margin-left:.5rem; font-size:.75rem; font-weight:800; color:#fff; background:var(--heart); border-radius:999px; padding:.1rem .5rem}
.where{color:var(--muted); font-weight:700; margin:.15rem 0 0}
.pieceHeart{position:relative; width:110px; height:100px; margin:.5rem auto 0}
.pieceHeart svg{width:100%; height:100%}
.pieceHeart span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:12px;
  font-family:"Fredoka", sans-serif; font-weight:700; font-size:1.9rem; color:#fff}

/* Heart burst */
.burst{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.burst i{position:absolute; bottom:-40px; width:26px; height:24px; animation:float 2.2s ease-out forwards}
.burst i svg{width:100%; height:100%}
@keyframes float{
  0%{transform:translateY(0) rotate(0) scale(.6); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-105vh) rotate(var(--r)) scale(1.1); opacity:0}
}

/* Welcome cloud */
.wcBack{position:fixed; inset:0; z-index:30; display:flex; align-items:center; justify-content:center; padding:4.5rem 16px 1.5rem; overflow-y:auto;
  background:color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); animation:wcFade .3s ease both}
.wcCloud{position:relative; width:100%; max-width:380px; margin:auto; filter:drop-shadow(0 6px 0 var(--line)) drop-shadow(0 14px 24px rgba(58,33,64,.12));
  animation:wcPop .6s cubic-bezier(.2,1.4,.4,1) .05s both}
.wcPuff{position:absolute; border-radius:50%; background:var(--card)}
.wcPuff.a{width:120px; height:120px; top:-52px; left:12%}
.wcPuff.b{width:150px; height:150px; top:-74px; left:38%}
.wcPuff.c{width:96px; height:96px; top:-36px; right:6%}
.wcPuff.d{width:80px; height:80px; bottom:-26px; left:18%}
.wcPuff.e{width:96px; height:96px; bottom:-34px; right:22%}
.wcPuff.f{width:84px; height:84px; top:22%; left:-14px}
.wcPuff.g{width:76px; height:76px; top:58%; left:-12px}
.wcPuff.h{width:80px; height:80px; top:34%; right:-14px}
.wcPuff.i{width:70px; height:70px; top:70%; right:-12px}
.wcBody{position:relative; background:var(--card); border-radius:56px; padding:1.6rem 1.5rem 2.2rem; text-align:center}
.wcHeart{width:46px; height:42px; margin:-.4rem auto .3rem}
.wcHeart svg{width:100%; height:100%}
.wcBody h2{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.55rem; line-height:1.15; color:var(--heart); margin:0 0 .8rem}
.wcBody p{margin:0 0 .75rem; color:var(--ink); line-height:1.5}
.wcBody p:last-of-type{font-weight:700}
.wcCheck{display:flex; align-items:center; justify-content:center; gap:.5rem; margin:1.1rem 0 .9rem; color:var(--muted); font-weight:700; font-size:.92rem; cursor:pointer}
.wcCheck input{width:20px; height:20px; accent-color:var(--heart); margin:0; cursor:pointer}
.wcBody button.primary{position:relative; z-index:1}
@keyframes wcFade{from{opacity:0}}
@keyframes wcPop{from{opacity:0; transform:translateY(16px) scale(.9)}}
@media (prefers-reduced-motion: reduce){ .wcBack, .wcCloud{animation:none} }

/* Confetti */
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.confetti i{position:absolute; top:-24px; width:9px; height:15px; border-radius:2px; animation:fall var(--d) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0); opacity:1}
  85%{opacity:1}
  100%{transform:translate(var(--x), 108vh) rotate(var(--r)); opacity:0}
}
.congrats{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.8rem; color:var(--heart); margin:0 0 .2rem}
.prizeCard .home{margin-top:1.3rem}

.test{margin-top:2rem; padding-top:1rem; border-top:2px dashed var(--warn); text-align:center}
.test p{color:var(--warn); margin:0; font-size:.9rem; font-weight:700}
@media (prefers-reduced-motion: reduce){ .reveal, .cxGroup, .shake, .pop{animation:none} .burst, .confetti{display:none} .tile{transition:none} }
</style>
