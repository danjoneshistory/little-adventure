/* ---------- App ---------- */
const KEY = "hunt-grid-v1";
const TEST = new URLSearchParams(location.search).has("test");
const P = HUNT.places;

function load(){
  const blank = { arrived: [], solved: [], finalSolved: false, spotArrived: [], spotSolved: [], steps: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.arrived) return Object.assign(blank, s); } catch(e){}
  return blank;
}
function save(){ saveLocal(); schedulePush(); }
function saveLocal(){
  const json = JSON.stringify(state);
  try { localStorage.setItem(KEY, json); }
  catch(e){ evictPhotos(); try { localStorage.setItem(KEY, json); } catch(_){} }   // out of room: drop photos that are safe on the server
}

/* ---------- Saving to the server ----------
   Progress and photos are also kept on a Cloudflare Worker, so nothing is lost if the
   phone's browser storage is cleared. The private link ends in #k=<hunt key>; the key is
   remembered on the phone after the first visit. Test mode (?test) never touches the server. */
const SYNC_URL = "https://little-adventure-sync.danjoneshistory.workers.dev";
const huntKey = (() => {
  if (TEST) return null;
  const m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
  let k = m && m[1];
  try { if (k) localStorage.setItem("hunt-key", k); else k = localStorage.getItem("hunt-key"); } catch(e){}
  return k || null;
})();
const syncOn = !!huntKey && SYNC_URL.startsWith("https://");
const api = (path, opts = {}) => fetch(SYNC_URL + path, {...opts, headers: {"X-Hunt-Key": huntKey, ...(opts.headers || {})}});
function mergeState(a, b){   // progress only grows: lists are combined and anything done stays done
  const list = k => [...new Set([...(a[k] || []), ...(b[k] || [])])];
  const steps = {};
  [a.steps, b.steps].forEach(src => Object.entries(src || {}).forEach(([key, done]) => {
    steps[key] = steps[key] || {};
    Object.entries(done || {}).forEach(([s, v]) => { if (v) steps[key][s] = true; });
  }));
  return { arrived: list("arrived"), solved: list("solved"), spotArrived: list("spotArrived"), spotSolved: list("spotSolved"),
           finalSolved: !!(a.finalSolved || b.finalSolved), steps };
}
let pushTimer = null, dirty = false;
function schedulePush(delay = 1200){ if (!syncOn) return; dirty = true; clearTimeout(pushTimer); pushTimer = setTimeout(push, delay); }
async function push(){
  if (!syncOn || !dirty) return;
  dirty = false;
  try { const r = await api("/state", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(state)}); if (!r.ok) throw r.status; }
  catch(e){ schedulePush(15000); }   // no signal: try again in a bit
}
async function pull(){
  if (!syncOn) return;
  try {
    const r = await api("/state"); if (!r.ok) throw r.status;
    const remote = await r.json();
    const before = JSON.stringify(state);
    state = mergeState(state, remote);
    saveLocal();
    if (JSON.stringify(mergeState(remote, {})) !== JSON.stringify(state)) schedulePush(0);   // phone had progress the server didn't
    await fetchMissingPhotos();
    if (JSON.stringify(state) !== before || photosFetched) { photosFetched = false; render(); }
  } catch(e){ setTimeout(pull, 15000); }
  flushPhotos();
}

let state = load();
let view = null;
let sub = null;   // chosen spot index while browsing a place with choices
let flash = null;

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
const has = (arr, i) => arr.includes(i);
const colorOf = i => COLORS[i % COLORS.length];
const spotKey = (i, k) => i + "-" + k;
const stepKey = (i, c) => c != null ? spotKey(i, c) : "p" + i;
function stepDone(key, step){ return !!(state.steps[key] && state.steps[key][step]); }
function markStep(key, step){ state.steps[key] = state.steps[key] || {}; state.steps[key][step] = true; save(); }
const PHOTO = key => "hunt-photo-" + key;
const photoCache = {};          // photos in memory (including ones downloaded from the server)
let photosFetched = false;
function pendingPhotos(){ try { return JSON.parse(localStorage.getItem("hunt-photo-pending")) || []; } catch(e){ return []; } }
function setPending(list){ try { localStorage.setItem("hunt-photo-pending", JSON.stringify(list)); } catch(e){} }
function getPhoto(key){ if (photoCache[key]) return photoCache[key]; try { return localStorage.getItem(PHOTO(key)); } catch(e){ return null; } }
function setPhoto(key, data){
  photoCache[key] = data;
  try { localStorage.setItem(PHOTO(key), data); } catch(e){}
  if (syncOn){ setPending([...new Set([...pendingPhotos(), key])]); uploadPhoto(key); }
}
async function uploadPhoto(key){
  const data = getPhoto(key); if (!data) return;
  try {
    const r = await api("/photo/" + key, {method:"PUT", headers:{"Content-Type":"text/plain"}, body: data});
    if (!r.ok) throw r.status;
    setPending(pendingPhotos().filter(k => k !== key));
  } catch(e){ setTimeout(() => uploadPhoto(key), 20000); }
}
function flushPhotos(){ if (syncOn) pendingPhotos().forEach(uploadPhoto); }
async function fetchMissingPhotos(){
  const keys = Object.keys(state.steps).filter(k => state.steps[k].photo && !getPhoto(k));
  await Promise.all(keys.map(async k => {
    try { const r = await api("/photo/" + k); if (r.ok){ photoCache[k] = await r.text(); photosFetched = true; } } catch(e){}
  }));
}
function evictPhotos(){   // free up phone storage by dropping photos that are already on the server
  const pending = pendingPhotos();
  try { Object.keys(localStorage).filter(k => k.startsWith("hunt-photo-") && k !== "hunt-photo-pending" && !pending.includes(k.slice(11)))
        .forEach(k => { photoCache[k.slice(11)] = photoCache[k.slice(11)] || localStorage.getItem(k); localStorage.removeItem(k); }); } catch(e){}
}
function clearPhotos(){ Object.keys(photoCache).forEach(k => delete photoCache[k]); try { Object.keys(localStorage).filter(k => k.startsWith("hunt-photo-")).forEach(k => localStorage.removeItem(k)); } catch(e){} }
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, 900 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
const spotOpen = (i, k) => has(state.spotArrived, spotKey(i, k));
const spotDone = (i, k) => has(state.spotSolved, spotKey(i, k));


function metres(lat1, lng1, lat2, lng2){
  const R = 6371000, r = x => x * Math.PI / 180;
  const a = Math.sin(r(lat2-lat1)/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function pretty(m){
  const ft = m * 3.28084;
  return ft < 1000 ? Math.round(ft/50)*50 + " ft" : (m/1609.34).toFixed(1) + " mi";
}
function el(tag, attrs = {}, text){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}
function art(html, cls){ const d = el("div", cls ? {class:cls, "aria-hidden":"true"} : {"aria-hidden":"true"}); d.innerHTML = html; return d; }
function setStatus(msg, kind){
  const s = document.getElementById("status");
  if (s){ s.textContent = msg; s.className = "status" + (kind ? " " + kind : ""); }
}
function go(v, c = null){ view = v; sub = c; render(); window.scrollTo(0, 0); }

function burst(n = 26){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b = el("div", {class:"burst"});
  for (let k = 0; k < n; k++){
    const i = el("i");
    i.innerHTML = heart(BURST[k % BURST.length], "none", 0);
    i.style.left = (Math.random() * 100) + "vw";
    i.style.animationDelay = (Math.random() * .6) + "s";
    i.style.setProperty("--r", (Math.random() * 120 - 60) + "deg");
    const sz = 16 + Math.random() * 22; i.style.width = sz + "px"; i.style.height = sz + "px";
    b.append(i);
  }
  document.body.append(b);
  setTimeout(() => b.remove(), 3200);
}

function confetti(n = 90){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = [...BURST, "#FF4F8B"];
  const b = el("div", {class:"confetti"});
  for (let k = 0; k < n; k++){
    const i = el("i");
    i.style.left = (Math.random() * 100) + "vw";
    i.style.background = colors[k % colors.length];
    i.style.animationDelay = (Math.random() * 1.2) + "s";
    i.style.setProperty("--d", (2.4 + Math.random() * 1.6) + "s");
    i.style.setProperty("--x", (Math.random() * 120 - 60) + "px");
    i.style.setProperty("--r", (Math.random() * 1080 - 540) + "deg");
    if (Math.random() < .35){ i.style.width = "10px"; i.style.height = "10px"; i.style.borderRadius = "50%"; }
    b.append(i);
  }
  document.body.append(b);
  setTimeout(() => b.remove(), 5500);
}

/* Grid */
function renderGrid(app){
  document.title = HUNT.title;
  const hero = el("header", {class:"hero"});
  hero.append(art(MASCOTS));
  hero.append(el("h1", {}, HUNT.title));
  hero.append(el("p", {}, HUNT.intro));
  const meter = el("div", {class:"meter", role:"img", "aria-label": state.solved.length + " of " + P.length + " pieces collected"});
  P.forEach((_, i) => meter.append(art(has(state.solved, i) ? heart("#FF4F8B", "#3A2140", 3) : heart("none", "#C8AFC9", 3, true))));
  hero.append(meter);
  app.append(hero);

  const grid = el("div", {class:"grid"});
  P.forEach((p, i) => {
    const solved = has(state.solved, i), arrived = has(state.arrived, i);
    if (p.soon){
      const t = el("button", {type:"button", class:"tile soon", "aria-label":"Coming soon", "aria-disabled":"true"});
      t.style.setProperty("--c", colorOf(i));
      t.append(art(ICONS.mystery, "ic"), el("span", {class:"nm"}, "Coming Soon"));
      grid.append(t);
      return;
    }
    const t = el("button", {type:"button", class:"tile" + (solved ? " solved" : arrived ? " open" : " todo")});
    t.style.setProperty("--c", colorOf(i));
    t.append(art(ICONS[p.icon] || ICONS.star, "ic"));
    t.append(el("span", {class:"nm"}, p.name));
    if (solved){
      t.append(el("span", {class:"check", "aria-label":"Completed"}, "✓"));
    } else if (arrived){
      t.append(el("span", {class:"tag"}, "Puzzle!"));
    }
    t.setAttribute("aria-label", p.name + ", " + (solved ? "solved" : arrived ? "puzzle open" : "not visited yet"));
    t.addEventListener("click", () => go(i));
    grid.append(t);
  });
  app.append(grid);

  const done = state.solved.length;
  const f = el("section", {class:"final"});
  f.append(el("h2", {}, "The big surprise"));
  f.append(el("p", {class:"sub"}, done < P.length ? done + " of " + P.length + " pieces collected" : HUNT.finalPuzzle.prompt));
  const slots = el("div", {class:"slots"});
  P.forEach((p, i) => {
    const got = has(state.solved, i);
    const s = art(got ? heart(BURST[i % BURST.length], "#3A2140", 2.6) : heart("none", "#E8C9D8", 2.6, true), "slot");
    if (got) s.append(el("span", {}, p.piece));
    slots.append(s);
  });
  f.append(slots);

  if (done === P.length){
    const needsAnswer = HUNT.finalPuzzle.answers.length > 0;
    if (!needsAnswer || state.finalSolved){
      f.append(el("p", {class:"big" + (flash === "final" ? " reveal" : "")}, HUNT.finalPuzzle.reveal));
    } else {
      const inp = el("input", {type:"text", placeholder:"Your answer", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Final answer"});
      const b = el("button", {type:"button", class:"primary"}, "Check answer");
      const submit = () => {
        if (!inp.value.trim()) return;
        if (HUNT.finalPuzzle.answers.some(a => norm(a) === norm(inp.value))){
          state.finalSolved = true; save(); flash = "final"; render(); burst(40);
        } else setStatus("So close! Try again.", "warn");
      };
      b.addEventListener("click", submit);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
      f.append(inp, b, el("p", {class:"status", id:"status"}));
    }
  }
  app.append(f);

  if (TEST){
    const t = el("section", {class:"test"});
    t.append(el("p", {}, "Test mode is on (remove ?test from the link before sharing)."));
    const r = el("button", {type:"button", class:"ghost"}, "Reset all progress");
    r.addEventListener("click", () => { clearPhotos(); try { localStorage.removeItem(WELCOME_KEY); } catch(e){} state = {arrived:[], solved:[], finalSolved:false, spotArrived:[], spotSolved:[], steps:{}}; save(); render(); showWelcome(); });
    t.append(r);
    app.append(t);
  }
}

/* One place */
function backBtn(label, fn){
  const b = el("button", {type:"button", class:"back"}, label);
  b.addEventListener("click", fn);
  return b;
}
function placeHead(i, title, subtitle, icon){
  const head = el("header", {class:"phead"});
  const bub = art(ICONS[icon || P[i].icon] || ICONS.star, "bubble");
  bub.style.setProperty("--c", colorOf(i));
  head.append(bub, el("h1", {}, title));
  if (subtitle) head.append(el("p", {class:"where"}, subtitle));
  return head;
}

function renderPlace(app, i){
  const p = P[i];
  const c = p.choices ? sub : null;

  // Choice menu
  if (p.choices && c == null){
    document.title = p.name + " · " + HUNT.title;
    app.append(backBtn("‹ All places", () => go(null)));
    app.append(placeHead(i, p.name));
    const card = el("section", {class:"card"});
    card.append(el("p", {class:"text"}, has(state.solved, i)
      ? "You earned this piece! You can still visit the other spots if you like."
      : p.greeting || "Your choice! Which spot are you visiting? You can switch any time."));
    app.append(card);
    if (p.choiceLayout === "tiles"){
      const g = el("div", {class:"grid choiceGrid"});
      p.choices.forEach((ch, k) => {
        const done = spotDone(i, k), open = spotOpen(i, k);
        const t = el("button", {type:"button", class:"tile" + (done ? " solved" : ""), "aria-label": ch.name + (done ? ", solved" : open ? ", puzzle open" : "")});
        t.style.setProperty("--c", colorOf(i + k + 1));
        t.append(art(ICONS[ch.icon] || ICONS.star, "ic"), el("span", {class:"nm"}, ch.name));
        if (done){ const bd = art(heart("#FF4F8B", "#fff", 4), "badge"); bd.append(el("span", {}, "✓")); t.append(bd); }
        else if (open) t.append(el("span", {class:"tag"}, "Puzzle!"));
        t.addEventListener("click", () => go(i, k));
        g.append(t);
      });
      app.append(g);
    } else {
      const ul = el("ul", {class:"choices"});
      p.choices.forEach((ch, k) => {
        const li = el("li");
        const btn = el("button", {type:"button", class:"choiceBtn"}, ch.name);
        const note = spotDone(i, k) ? "Solved" : spotOpen(i, k) ? "Puzzle!" : null;
        if (note) btn.append(el("span", {class:"choiceNote"}, note));
        btn.addEventListener("click", () => go(i, k));
        li.append(btn); ul.append(li);
      });
      card.append(ul);
    }
    return;
  }

  const spot = c != null ? p.choices[c] : null;
  const e = spot ? Object.assign({}, p, spot, {name: p.name}) : p;
  const arrived = spot ? spotOpen(i, c) : has(state.arrived, i);
  const solved = spot ? spotDone(i, c) : has(state.solved, i);
  document.title = (spot ? spot.name : p.name) + " · " + HUNT.title;
  if (spot) app.append(backBtn("‹ " + p.name, () => go(i, null)));
  else app.append(backBtn("‹ All places", () => go(null)));
  app.append(placeHead(i, spot ? spot.name : p.name, spot ? p.name : null, spot ? spot.icon : null));

  if (!arrived){
    const card = el("section", {class:"card"});
    if (e.about) card.append(el("p", {class:"text"}, e.about));
    if (e.lat != null && e.lng != null){
      const ll = e.lat + "," + e.lng;
      const pin = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="#FF4F8B"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>';
      const link = (label, href) => { const a = el("a", {href, target:"_blank", rel:"noopener"}); a.innerHTML = pin; a.append(label); return a; };
      const row = el("div", {class:"dirs"});
      row.append(link("Apple Maps", "https://maps.apple.com/?daddr=" + ll),
                 link("Google Maps", "https://www.google.com/maps/dir/?api=1&destination=" + ll));
      card.append(el("p", {class:"dirsLabel"}, "Get directions"), row);
    }
    card.append(el("p", {class:"text", style: e.about ? "margin-top:1rem; font-weight:800" : "margin-top:1rem"},
      e.about ? "When you arrive, tap the button below." : "When you get here, tap the button below to open your puzzle."));
    const b = el("button", {type:"button", class:"primary", id:"check"}, "I’m here! Check my location");
    b.addEventListener("click", () => check(i, c));
    card.append(b, el("p", {class:"status", id:"status"}));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: open without GPS");
      u.addEventListener("click", () => arrive(i, c));
      card.append(u);
    }
    app.append(card);
    return;
  }

  const key = stepKey(i, c);

  // Step: intro page
  if (e.intro && !solved && !stepDone(key, "intro")){
    e.intro.sections.forEach((sec, n) => {
      const sc = el("section", {class:"card" + (flash === "arrive" ? " reveal" : "")});
      if (sec.heading) sc.append(el("h2", {}, sec.heading));
      sc.append(el("p", {class:"text body"}, sec.text));
      app.append(sc);
    });
    const b = el("button", {type:"button", class:"primary"}, e.intro.button || "Next");
    b.addEventListener("click", () => { markStep(key, "intro"); flash = "arrive"; render(); window.scrollTo(0, 0); });
    app.append(b);
    return;
  }

  // Step: photo
  if (e.photo && !solved && !stepDone(key, "photo")){
    const pc = el("section", {class:"card photoCard" + (flash === "arrive" ? " reveal" : "")});
    pc.append(el("h2", {}, e.photo.heading || "Picture time!"));
    pc.append(el("p", {class:"text"}, e.photo.text));
    const input = el("input", {type:"file", accept:"image/*", id:"photoIn", class:"visually-hidden"});
    const drop = el("label", {for:"photoIn", class:"drop"});
    drop.append(art(CAMERA, "cam"), el("span", {}, "Tap to take or choose a photo"));
    const preview = el("img", {class:"preview", alt:"Your photo", hidden:""});
    const send = el("button", {type:"button", class:"primary", hidden:""}, "Submit photo");
    const again = el("label", {for:"photoIn", class:"ghost again", hidden:""}, "Choose a different photo");
    let data = null;
    input.addEventListener("change", async () => {
      const f = input.files && input.files[0];
      if (!f) return;
      setStatus("Getting your photo ready…");
      try { data = await shrink(f); } catch(err){ setStatus("Couldn’t read that photo. Try another one.", "warn"); return; }
      preview.src = data; preview.hidden = false; drop.hidden = true; send.hidden = false; again.hidden = false;
      setStatus("");
    });
    send.addEventListener("click", () => {
      if (!data) return;
      setPhoto(key, data); markStep(key, "photo"); flash = "arrive"; render(); burst(14); window.scrollTo(0, 0);
    });
    pc.append(input, drop, preview, send, again, el("p", {class:"status", id:"status"}));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: skip photo");
      u.addEventListener("click", () => { markStep(key, "photo"); render(); });
      pc.append(u);
    }
    app.append(pc);
    return;
  }

  const card = el("section", {class:"card" + (flash === "arrive" ? " reveal" : "")});
  card.append(el("h2", {}, "Your puzzle"));
  card.append(el("p", {class:"text"}, e.puzzle));
  const GAMES = {connections, strands, crossword};
  if (!solved && e.game && GAMES[e.game.type]){
    GAMES[e.game.type](card, e.game, () => solve(i, c));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: mark solved");
      u.addEventListener("click", () => solve(i, c));
      card.append(u);
    }
  } else if (!solved){
    const inp = el("input", {type:"text", placeholder:"Your answer", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Answer"});
    const b = el("button", {type:"button", class:"primary"}, "Check answer");
    const submit = () => {
      if (!inp.value.trim()) return;
      if ((e.answers || []).some(a => norm(a) === norm(inp.value))) solve(i, c);
      else setStatus("So close! Try again.", "warn");
    };
    b.addEventListener("click", submit);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") submit(); });
    card.append(inp, b, el("p", {class:"status", id:"status"}));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: mark solved");
      u.addEventListener("click", () => solve(i, c));
      card.append(u);
    }
  }
  app.append(card);

  if (solved){
    const justSolved = flash === "solve";
    const pr = el("section", {class:"card prizeCard" + (justSolved ? " reveal" : "")});
    pr.append(el("p", {class:"congrats"}, "Congratulations!"));
    const ph0 = getPhoto(stepKey(i, c));
    if (ph0){ pr.append(el("img", {class:"preview keep", src: ph0, alt:"Your photo"})); }
    if (e.prize){
      pr.append(el("h2", {}, "Your prize"));
      pr.append(el("p", {class:"text"}, e.prize));
    }
    pr.append(el("h2", {style: e.prize ? "margin-top:1.3rem" : ""}, "Your piece of the big surprise"));
    const ph = art(heart("#FF4F8B", "#3A2140", 2.6), "pieceHeart");
    ph.append(el("span", {}, p.piece));
    pr.append(ph);
    const home = el("button", {type:"button", class:"primary home"}, "Back to all places");
    home.addEventListener("click", () => go(null));
    pr.append(home);
    app.append(pr);
    if (justSolved) requestAnimationFrame(() => pr.scrollIntoView({behavior:"smooth", block:"start"}));
  }
}

/* Mini crossword */
function crossword(root, game, onWin){
  const sol = game.rows.map(r => r.toUpperCase());
  const H = sol.length, W = sol[0].length;
  const isBlk = (r, c) => r < 0 || c < 0 || r >= H || c >= W || sol[r][c] === ".";
  const fill = sol.map(row => [...row].map(ch => ch === "." ? "." : ""));
  const nums = sol.map(row => [...row].map(() => 0));
  const clues = [];   // {dir:"A"|"D", num, text, cells:[[r,c]...]}
  let n = 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
    if (isBlk(r, c)) continue;
    const a = isBlk(r, c - 1) && !isBlk(r, c + 1), d = isBlk(r - 1, c) && !isBlk(r + 1, c);
    if (!a && !d) continue;
    nums[r][c] = ++n;
    if (a){ const cells = []; for (let x = c; !isBlk(r, x); x++) cells.push([r, x]); clues.push({dir:"A", num:n, text:(game.across || {})[n] || "", cells}); }
    if (d){ const cells = []; for (let y = r; !isBlk(y, c); y++) cells.push([y, c]); clues.push({dir:"D", num:n, text:(game.down || {})[n] || "", cells}); }
  }
  const order = [...clues.filter(q => q.dir === "A"), ...clues.filter(q => q.dir === "D")];
  const clueAt = (r, c, dir) => clues.find(q => q.dir === dir && q.cells.some(([y, x]) => y === r && x === c));
  let cur = [0, 0], dir = "A", wrong = new Set(), over = false, msgTimer;
  for (let r = 0, f = false; r < H && !f; r++) for (let c = 0; c < W; c++) if (!isBlk(r, c)){ cur = [r, c]; f = true; break; }
  if (!clueAt(cur[0], cur[1], "A")) dir = "D";

  const wrap = el("div", {class:"xw"});
  if (game.title) wrap.append(el("p", {class:"xwTitle"}, game.title));
  const bar = el("div", {class:"xwBar"});
  const prev = el("button", {type:"button", "aria-label":"Previous clue"}, "‹");
  const next = el("button", {type:"button", "aria-label":"Next clue"}, "›");
  const barText = el("p", {"aria-live":"polite"});
  bar.append(prev, barText, next);
  const grid = el("div", {class:"xwGrid", role:"grid", "aria-label":"Crossword"});
  grid.style.gridTemplateColumns = "repeat(" + W + ", minmax(0,1fr))";
  const cells = sol.map((row, r) => [...row].map((ch, c) => {
    const d = el("div", {class:"xwCell" + (ch === "." ? " blk" : ""), role:"gridcell"});
    grid.append(d); return d;
  }));
  const inp = el("input", {class:"xwInput", type:"text", autocomplete:"off", autocorrect:"off", autocapitalize:"characters", spellcheck:"false", "aria-label":"Crossword letter", enterkeyhint:"next"});
  const lists = el("div", {class:"xwClues"});
  const clueBtns = new Map();
  [["A", "Across"], ["D", "Down"]].forEach(([dd, label]) => {
    const sec = el("section"); sec.append(el("h3", {}, label));
    const ol = el("ol");
    clues.filter(q => q.dir === dd).forEach(q => {
      const li = el("li"), b = el("button", {type:"button", class:"xwClue"});
      b.append(el("b", {}, String(q.num)), el("span", {}, q.text));
      b.addEventListener("click", () => { if (over) return; dir = q.dir; cur = firstEmpty(q); draw(); focus(); });
      li.append(b); ol.append(li); clueBtns.set(q, b);
    });
    sec.append(ol); lists.append(sec);
  });
  const btns = el("div", {class:"xwBtns"});
  const checkBtn = el("button", {type:"button", class:"cxBtn"}, "Check");
  const clearBtn = el("button", {type:"button", class:"cxBtn"}, "Clear wrong");
  btns.append(checkBtn, clearBtn);
  const msg = el("p", {class:"status", role:"status"});
  wrap.append(bar, grid, inp, btns, msg, lists);
  root.append(wrap);

  const active = () => clueAt(cur[0], cur[1], dir) || clueAt(cur[0], cur[1], dir === "A" ? "D" : "A");
  function firstEmpty(q){ const e = q.cells.find(([r, c]) => !fill[r][c]); return (e || q.cells[0]).slice(); }
  function say(t, cls){ clearTimeout(msgTimer); msg.textContent = t; msg.className = "status" + (cls ? " " + cls : ""); if (t && cls !== "ok") msgTimer = setTimeout(() => { msg.textContent = ""; }, 2500); }

  function draw(){
    const q = active(); if (q) dir = q.dir;
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
      if (isBlk(r, c)) continue;
      const d = cells[r][c];
      const inWord = q && q.cells.some(([y, x]) => y === r && x === c);
      const isCur = r === cur[0] && c === cur[1];
      d.className = "xwCell" + (over ? " done" : isCur ? " cur" : inWord ? " word" : "") + (wrong.has(r + "," + c) ? " wrong" : "");
      d.textContent = fill[r][c];
      if (nums[r][c]) d.prepend(el("small", {}, String(nums[r][c])));
    }
    if (q){ barText.textContent = ""; barText.append(el("b", {}, q.num + (q.dir === "A" ? "A" : "D")), el("span", {}, q.text)); }
    clueBtns.forEach((b, cq) => {
      b.className = "xwClue" + (cq === q ? " on" : "") + (cq.cells.every(([r, c]) => fill[r][c]) ? " filled" : "");
    });
    checkBtn.disabled = clearBtn.disabled = over;
  }

  function focus(){ if (over) return; inp.value = " "; try { inp.focus({preventScroll:true}); inp.setSelectionRange(1, 1); } catch (_) {} }

  function step(q, k){ // move to cell k of clue q
    cur = q.cells[k].slice();
  }
  function gotoClue(delta){
    const q = active(); let k = order.indexOf(q);
    k = (k + delta + order.length) % order.length;
    dir = order[k].dir; cur = firstEmpty(order[k]); draw();
  }
  function typeLetter(ch){
    if (over) return;
    const [r, c] = cur; fill[r][c] = ch; wrong.delete(r + "," + c);
    const q = active(), k = q.cells.findIndex(([y, x]) => y === r && x === c);
    // Where next: the next empty square in this word; once the word is full,
    // the next clue that still has an empty square; if the puzzle is full, just step forward.
    const empty = ([y, x]) => !fill[y][x];
    const later = q.cells.slice(k + 1).find(empty) || q.cells.slice(0, k).find(empty);
    const o = order.indexOf(q);
    const nextQ = later ? null : [...order.slice(o + 1), ...order.slice(0, o)].find(nq => nq.cells.some(empty));
    if (later) cur = later.slice();
    else if (nextQ){ dir = nextQ.dir; cur = firstEmpty(nextQ); }
    else if (k + 1 < q.cells.length) step(q, k + 1);
    draw(); checkDone();
  }
  function backspace(){
    if (over) return;
    const [r, c] = cur;
    if (fill[r][c]){ fill[r][c] = ""; wrong.delete(r + "," + c); draw(); return; }
    const q = active(), k = q.cells.findIndex(([y, x]) => y === r && x === c);
    if (k > 0){ step(q, k - 1); const [y, x] = cur; fill[y][x] = ""; wrong.delete(y + "," + x); }
    draw();
  }
  function move(dr, dc){
    const nd = dc ? "A" : "D";
    if (dir !== nd && clueAt(cur[0], cur[1], nd)){ dir = nd; draw(); return; }
    let [r, c] = cur;
    do { r += dr; c += dc; } while (r >= 0 && c >= 0 && r < H && c < W && isBlk(r, c));
    if (r >= 0 && c >= 0 && r < H && c < W) cur = [r, c];
    draw();
  }
  function checkDone(){
    const full = sol.every((row, r) => [...row].every((ch, c) => ch === "." || fill[r][c]));
    if (!full) return;
    const right = sol.every((row, r) => [...row].every((ch, c) => ch === "." || fill[r][c] === ch));
    if (right){
      over = true; inp.blur(); draw(); say("You solved it! 💕", "ok");
      setTimeout(onWin, 1100);
    } else say("Almost! Something isn’t quite right. Tap Check to find it.", "warn");
  }

  grid.addEventListener("click", ev => {
    if (over) return;
    const d = ev.target.closest(".xwCell"); if (!d || d.classList.contains("blk")) return;
    const idx = [...grid.children].indexOf(d), r = Math.floor(idx / W), c = idx % W;
    if (r === cur[0] && c === cur[1]){ const o = dir === "A" ? "D" : "A"; if (clueAt(r, c, o)) dir = o; }
    else { cur = [r, c]; if (!clueAt(r, c, dir)) dir = dir === "A" ? "D" : "A"; }
    draw(); focus();
  });
  prev.addEventListener("click", () => { gotoClue(-1); focus(); });
  next.addEventListener("click", () => { gotoClue(1); focus(); });
  checkBtn.addEventListener("click", () => {
    wrong = new Set();
    sol.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== "." && fill[r][c] && fill[r][c] !== ch) wrong.add(r + "," + c); }));
    draw();
    say(wrong.size ? wrong.size + (wrong.size === 1 ? " square is" : " squares are") + " marked. Keep going!" : "Everything so far is right!", wrong.size ? "warn" : "ok");
  });
  clearBtn.addEventListener("click", () => {
    let k = 0;
    sol.forEach((row, r) => [...row].forEach((ch, c) => { if (ch !== "." && fill[r][c] && fill[r][c] !== ch){ fill[r][c] = ""; k++; } }));
    wrong = new Set(); draw(); say(k ? "Cleared " + k + (k === 1 ? " square." : " squares.") : "Nothing to clear. Looking good!", k ? "warn" : "ok");
    focus();
  });

  // The hidden input holds one space; a letter typed after it is the guess, and an empty box means Backspace.
  inp.addEventListener("input", () => {
    const v = inp.value;
    if (v === "") backspace();
    else for (const ch of v.replace(/[^a-z]/gi, "").toUpperCase()) if (!over) typeLetter(ch);
    inp.value = " "; try { inp.setSelectionRange(1, 1); } catch (_) {}
  });
  inp.addEventListener("keydown", ev => {
    const k = ev.key;
    if (k === "ArrowLeft"){ ev.preventDefault(); move(0, -1); }
    else if (k === "ArrowRight"){ ev.preventDefault(); move(0, 1); }
    else if (k === "ArrowUp"){ ev.preventDefault(); move(-1, 0); }
    else if (k === "ArrowDown"){ ev.preventDefault(); move(1, 0); }
    else if (k === "Enter" || k === "Tab"){ ev.preventDefault(); gotoClue(ev.shiftKey ? -1 : 1); }
    else if (k === "Backspace" && inp.value === " "){ ev.preventDefault(); backspace(); }
    else if (k === " "){ ev.preventDefault(); const o = dir === "A" ? "D" : "A"; if (clueAt(cur[0], cur[1], o)){ dir = o; draw(); } }
  });
  draw();
}

/* Strands game */
function strands(root, game, onWin){
  const rows = game.rows.map(r => r.toUpperCase());
  const C = rows[0].length, letters = rows.join("");
  const words = game.words.map(w => ({word: w.word.toUpperCase(), path: w.path, span: !!w.spangram}));
  const owner = new Array(letters.length).fill(null);   // cell -> found word
  let sel = [], dragging = false, moved = false, lastPt = [0, 0], over = false, hint = null, hintsLeft = game.hints ?? 3, msgTimer;

  const wrap = el("div", {class:"st"});
  const theme = el("div", {class:"stTheme"});
  theme.append(el("span", {}, "Today’s theme"), el("strong", {}, game.theme));
  const shown = el("p", {class:"stWord", "aria-live":"polite"});
  const board = el("div", {class:"stBoard", role:"group", "aria-label":"Letter board"});
  board.style.setProperty("--cols", C);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "stLines"); svg.setAttribute("aria-hidden", "true");
  board.append(svg);
  const cells = [...letters].map((ch, k) => { const b = el("button", {type:"button", class:"stCell", "aria-label": ch}, ch); board.append(b); return b; });
  const prog = el("p", {class:"stProg"});
  const btns = el("div", {class:"stBtns"});
  const hintBtn = el("button", {type:"button", class:"cxBtn"});
  btns.append(hintBtn);
  wrap.append(theme, shown, board, prog, btns);
  root.append(wrap);

  const rc = k => [Math.floor(k / C), k % C];
  const adjacent = (a, b) => { const [ra, ca] = rc(a), [rb, cb] = rc(b); return a !== b && Math.abs(ra - rb) <= 1 && Math.abs(ca - cb) <= 1; };
  const nFound = () => words.filter(w => w.found).length;

  function say(text, cls){
    clearTimeout(msgTimer);
    shown.textContent = text; shown.className = "stWord" + (cls ? " " + cls : "");
    if (cls) msgTimer = setTimeout(() => { if (!sel.length) { shown.textContent = ""; shown.className = "stWord"; } }, 1400);
  }

  function draw(){
    cells.forEach((b, k) => {
      const w = owner[k];
      b.className = "stCell" + (w ? (w.span ? " span" : " found") : sel.includes(k) ? " sel" : "") + (!w && hint && hint.path.includes(k) ? " hint" : "");
      b.disabled = over;
    });
    if (sel.length) say(sel.map(k => letters[k]).join(""));
    prog.textContent = nFound() + " of " + words.length + " theme words found";
    hintBtn.textContent = hintsLeft ? "Hint (" + hintsLeft + " left)" : "No hints left";
    hintBtn.disabled = over || !hintsLeft || !!hint;
    lines();
  }

  function lines(){
    const box = board.getBoundingClientRect();
    if (!box.width) return;
    const ctr = k => { const r = cells[k].getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top]; };
    const w = cells[0].getBoundingClientRect().width * 0.34;
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    svg.textContent = "";
    const line = (path, color) => {
      if (path.length < 2) return;
      const pl = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      pl.setAttribute("points", path.map(k => ctr(k).join(",")).join(" "));
      pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color); pl.setAttribute("stroke-width", w);
      pl.setAttribute("stroke-linecap", "round"); pl.setAttribute("stroke-linejoin", "round");
      svg.append(pl);
    };
    words.filter(x => x.found).forEach(x => line(x.path, x.span ? "var(--butter)" : "var(--sky)"));
    line(sel, "var(--ink)");
  }

  function submit(){
    const picked = sel; sel = [];
    if (picked.length < 2){ draw(); return; }
    const text = picked.map(k => letters[k]).join("");
    // Right word on that word's squares, in any order (so either of two touching F's can come first).
    const same = w => w.path.length === picked.length && picked.every(k => w.path.includes(k));
    const hit = words.find(w => !w.found && w.word === text && same(w));
    if (hit){
      hit.found = true; hit.path = picked; hit.path.forEach(k => owner[k] = hit);
      if (hint === hit) hint = null;
      draw();
      say(hit.span ? "SPANGRAM! " + hit.word : hit.word, "ok");
      hit.path.forEach(k => cells[k].classList.add("pop"));
      if (nFound() === words.length){
        over = true; draw(); say("You found them all!", "ok");
        setTimeout(onWin, 1000);
      }
      return;
    }
    draw();
    const already = words.some(w => w.found && w.word === text);
    say(already ? "Already found!" : picked.length < 4 ? "Too short" : "Not a theme word", "warn");
    picked.forEach(k => { cells[k].classList.remove("shake"); void cells[k].offsetWidth; cells[k].classList.add("shake"); });
  }

  // Which free cell is under the finger? Only counts near the middle of a letter, so diagonals are easy.
  function cellAt(x, y){
    for (let k = 0; k < cells.length; k++){
      if (owner[k]) continue;
      const r = cells[k].getBoundingClientRect();
      const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
      if (dx * dx + dy * dy <= (r.width * 0.42) ** 2) return k;
    }
    return null;
  }

  board.addEventListener("pointerdown", ev => {
    if (over) return;
    const k = cellAt(ev.clientX, ev.clientY);
    if (k == null) return;
    ev.preventDefault();
    try { board.setPointerCapture(ev.pointerId); } catch (_) {}
    const last = sel[sel.length - 1];
    if (sel.length && k === last){ submit(); return; }          // tap the last letter again to check
    if (sel.includes(k)) sel = sel.slice(0, sel.indexOf(k) + 1); // tap back along the path
    else if (sel.length && adjacent(last, k)) sel.push(k);      // tap the next letter
    else sel = [k];                                             // start a new word
    dragging = true; moved = false; lastPt = [ev.clientX, ev.clientY];
    draw();
  });
  function dragTo(x, y){
    const k = cellAt(x, y);
    if (k == null || k === sel[sel.length - 1]) return false;
    if (k === sel[sel.length - 2]){ sel.pop(); moved = true; return true; }
    if (!sel.includes(k) && adjacent(sel[sel.length - 1], k)){ sel.push(k); moved = true; return true; }
    return false;
  }
  board.addEventListener("pointermove", ev => {
    if (!dragging) return;
    // Check points along the way too, so a fast swipe doesn't skip a letter.
    const [x0, y0] = lastPt, x1 = ev.clientX, y1 = ev.clientY;
    const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 6));
    let changed = false;
    for (let s = 1; s <= steps; s++) changed = dragTo(x0 + (x1 - x0) * s / steps, y0 + (y1 - y0) * s / steps) || changed;
    lastPt = [x1, y1];
    if (changed) draw();
  });
  const end = () => { if (!dragging) return; dragging = false; if (moved && sel.length > 1) submit(); };
  board.addEventListener("pointerup", end);
  board.addEventListener("pointercancel", end);
  // Keyboard: Enter/Space on a letter works like a tap.
  cells.forEach((b, k) => b.addEventListener("keydown", ev => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    ev.preventDefault(); if (over || owner[k]) return;
    const last = sel[sel.length - 1];
    if (sel.length && k === last) submit();
    else { if (sel.includes(k)) sel = sel.slice(0, sel.indexOf(k) + 1); else if (sel.length && adjacent(last, k)) sel.push(k); else sel = [k]; draw(); }
  }));

  hintBtn.addEventListener("click", () => {
    if (over || !hintsLeft || hint) return;
    const left = words.filter(w => !w.found && !w.span);
    hint = left.length ? left[Math.floor(Math.random() * left.length)] : words.find(w => !w.found);
    hintsLeft--; draw();
    say("Hint: the dashed letters make one word", "ok");
  });

  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => board.isConnected && lines(), 100); });
  draw();
  requestAnimationFrame(lines);
  if (document.fonts) document.fonts.ready.then(() => board.isConnected && lines());
}

/* Connections game */
function connections(root, game, onWin){
  const GROUP_COLORS = {yellow:"var(--butter)", green:"var(--mint)", blue:"var(--sky)", purple:"var(--lilac)"};
  const shuffle = a => { const r = [...a]; for (let k = r.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [r[k], r[j]] = [r[j], r[k]]; } return r; };
  let remaining, selected, found, lives, busy, over;
  const wrap = el("div", {class:"cx"});
  const solvedBox = el("div", {class:"cxSolved", "aria-live":"polite"});
  const grid = el("div", {class:"cxGrid", role:"group", "aria-label":"Words"});
  const livesRow = el("div", {class:"cxLives"});
  const msg = el("p", {class:"status", role:"status"});
  const ctr = el("div", {class:"cxCtr"});
  const bShuf = el("button", {type:"button", class:"cxBtn"}, "Shuffle");
  const bClear = el("button", {type:"button", class:"cxBtn"}, "Deselect");
  const bGo = el("button", {type:"button", class:"primary"}, "Submit");
  ctr.append(bShuf, bClear);
  wrap.append(solvedBox, grid, livesRow, ctr, bGo, msg);
  root.append(wrap);

  function reset(){
    remaining = shuffle(game.groups.flatMap(g => g.words));
    selected = new Set(); found = 0; lives = 4; busy = false; over = false;
    solvedBox.textContent = ""; msg.textContent = ""; msg.className = "status";
    draw();
  }
  function drawLives(){
    livesRow.textContent = "";
    livesRow.append(el("span", {}, "Mistakes left"));
    const hs = el("span", {class:"cxHearts", role:"img", "aria-label": lives + " mistakes left"});
    for (let k = 0; k < 4; k++) hs.append(art(k < lives ? heart("#FF4F8B", "#3A2140", 3) : heart("none", "#C8AFC9", 3, true)));
    livesRow.append(hs);
  }
  function draw(){
    grid.textContent = "";
    remaining.forEach(w => {
      const t = el("button", {type:"button", class:"cxWord" + (selected.has(w) ? " sel" : ""), "aria-pressed": String(selected.has(w))}, w);
      t.disabled = busy || over;
      t.addEventListener("click", () => {
        if (busy || over) return;
        msg.textContent = ""; msg.className = "status";
        selected.has(w) ? selected.delete(w) : selected.size < 4 && selected.add(w);
        draw();
      });
      grid.append(t);
    });
    bGo.disabled = selected.size !== 4 || busy || over;
    bShuf.disabled = bClear.disabled = busy || over;
    drawLives();
  }
  function showGroup(g){
    const box = el("div", {class:"cxGroup"});
    box.style.background = GROUP_COLORS[g.color] || "var(--pink)";
    box.append(el("strong", {}, g.theme), el("span", {}, g.words.join(" · ")));
    solvedBox.append(box);
  }
  bShuf.addEventListener("click", () => { remaining = shuffle(remaining); draw(); });
  bClear.addEventListener("click", () => { selected.clear(); draw(); });
  bGo.addEventListener("click", () => {
    if (selected.size !== 4 || busy || over) return;
    busy = true;
    const tiles = [...grid.children].filter(t => selected.has(t.textContent));
    const g = game.groups.find(gr => gr.words.every(w => selected.has(w)));
    draw();
    if (g){
      tiles.forEach(t => t.classList.add("pop"));
      msg.textContent = "Yes!"; msg.className = "status ok";
      setTimeout(() => {
        showGroup(g);
        remaining = remaining.filter(w => !selected.has(w));
        selected.clear(); found++; busy = false;
        if (found === game.groups.length){
          over = true; msg.textContent = "All four found!";
          draw(); setTimeout(onWin, 900);
        } else draw();
      }, 350);
    } else {
      lives--;
      const oneAway = game.groups.some(gr => gr.words.filter(w => selected.has(w)).length === 3);
      msg.textContent = oneAway ? "One away!" : "Not quite. Try again!"; msg.className = "status warn";
      tiles.forEach(t => t.classList.add("shake"));
      setTimeout(() => {
        selected.clear(); busy = false;
        if (lives === 0){
          over = true; msg.textContent = "Out of guesses! Take a breath and try again.";
          const again = el("button", {type:"button", class:"primary"}, "Start over");
          again.addEventListener("click", () => { again.remove(); reset(); });
          wrap.append(again);
        }
        draw();
      }, 400);
    }
  });
  reset();
}

function render(){
  const app = document.getElementById("app");
  app.textContent = "";
  view === null ? renderGrid(app) : renderPlace(app, view);
  flash = null;
}

function arrive(i, c){
  if (c != null && !spotOpen(i, c)) state.spotArrived.push(spotKey(i, c));
  if (!has(state.arrived, i)) state.arrived.push(i);
  save(); flash = "arrive"; render();
}
function solve(i, c){
  if (c != null){
    if (!spotOpen(i, c)) state.spotArrived.push(spotKey(i, c));
    if (!spotDone(i, c)) state.spotSolved.push(spotKey(i, c));
  }
  if (!has(state.arrived, i)) state.arrived.push(i);
  if (!has(state.solved, i)) state.solved.push(i);
  save(); flash = "solve"; render(); confetti();
}

function check(i, c){
  const p = P[i], btn = document.getElementById("check");
  const t = c != null ? p.choices[c] : p;
  if (t.lat == null || t.lng == null){ setStatus("This place doesn’t have a location set yet.", "warn"); return; }
  if (!("geolocation" in navigator)){ setStatus("This browser can’t share location. Try Safari or Chrome on your phone.", "warn"); return; }
  btn.disabled = true; setStatus("Finding you…");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false;
    const d = metres(pos.coords.latitude, pos.coords.longitude, t.lat, t.lng);
    const slack = Math.min(pos.coords.accuracy || 0, 50);
    if (d <= t.radius + slack){
      setStatus("You made it!", "ok");
      setTimeout(() => arrive(i, c), 600);
    } else {
      let msg = HUNT.showDistance ? "Not quite there! You’re about " + pretty(d) + " away." : "Not quite there yet!";
      if (pos.coords.accuracy > 150) msg += " Your GPS signal is weak, so step outside and try again.";
      setStatus(msg, "warn");
    }
  }, err => {
    btn.disabled = false;
    if (err.code === 1) setStatus("Location is turned off for this page. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using. Then reload and try again.", "warn");
    else if (err.code === 3) setStatus("That took too long. Step outside for a clearer signal and try again.", "warn");
    else setStatus("Couldn’t get your location. Check that Location Services is on and try again.", "warn");
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}

/* Welcome cloud: shown each visit until they tick "Don't show this again" */
const WELCOME_KEY = "hunt-welcome-hidden";
function showWelcome(){
  const w = HUNT.welcome;
  if (!w || document.querySelector(".wcBack")) return;
  try { if (localStorage.getItem(WELCOME_KEY) === "1") return; } catch(e){}
  const back = el("div", {class:"wcBack", role:"dialog", "aria-modal":"true", "aria-labelledby":"wcTitle"});
  const cloud = el("div", {class:"wcCloud"});
  ["a", "b", "c", "d", "e", "f", "g", "h", "i"].forEach(p => cloud.append(el("div", {class:"wcPuff " + p, "aria-hidden":"true"})));
  const body = el("div", {class:"wcBody"});
  body.append(art(heart("#FF4F8B", "#3A2140", 3), "wcHeart"), el("h2", {id:"wcTitle"}, w.title));
  w.paragraphs.forEach(t => body.append(el("p", {}, t)));
  const lab = el("label", {class:"wcCheck"});
  const box = el("input", {type:"checkbox"});
  lab.append(box, el("span", {}, w.dontShow));
  const go = el("button", {type:"button", class:"primary"}, w.button);
  const close = () => {
    try { if (box.checked) localStorage.setItem(WELCOME_KEY, "1"); } catch(e){}
    back.remove(); document.removeEventListener("keydown", esc);
  };
  const esc = ev => { if (ev.key === "Escape") close(); };
  go.addEventListener("click", close);
  document.addEventListener("keydown", esc);
  body.append(lab, go);
  cloud.append(body); back.append(cloud);
  document.body.append(back);
  go.focus({preventScroll:true});
}

render();
showWelcome();
pull();   // bring in progress saved on the server (does nothing in test mode or without the key)
addEventListener("online", () => { schedulePush(0); flushPhotos(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty){ clearTimeout(pushTimer); push(); } });
