/* =====================================================================

     soon     - true = tile shows "Coming Soon", faded, can't be opened yet.
                Delete "soon: true," to reveal a place.
     name     - shown on the tile (keep it short)
     icon     - climb, mountain, art, bag, book, giraffe, trees, coffee,
                duck, guitar, koi, beach, lighthouse, gift, star
     lat/lng  - location; radius = how close (metres) to unlock
     puzzle   - shown once they arrive (line breaks are kept)
     answers  - accepted answers; case, spaces and punctuation are ignored
     prize    - shown when they solve it
     piece    - their piece of the final puzzle
     choices  - optional: instead of one lat/lng, a list of spots to pick from.
                Each spot gets its own screen and its own puzzle / answers / prize.
                Once they unlock one spot, that becomes their pick for this place.
   finalPuzzle:
     prompt   - shown once all 12 pieces are collected
     answers  - leave [] to reveal the big thing right away,
                or add answers to make them solve the final puzzle too
     reveal   - the big thing
   ===================================================================== */

    { soon: true, name: "Guitar Center",      icon: "guitar",   lat: 40.64678, lng: -111.94265, radius: 90,  puzzle: "PUZZLE 10", answers: ["answer10"], prize: "PRIZE 10", piece: "13" }

<style>
:root{
  --bg:#FFF5F9; --card:#FFFFFF; --ink:#3A2140; --muted:#7B6280; --line:#F3DCE7;
  --pink:#FF8FB8; --lilac:#C4B0FF; --mint:#8FDFC5; --butter:#FFDB75; --sky:#9DD2FF; --peach:#FFB894;
  --heart:#FF4F8B; --ok:#1F9D6E; --warn:#D9466F;
  --tile-ink:#3A2140; --shadow:0 6px 0 #F3DCE7;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#241629; --card:#33213B; --ink:#FDEFF6; --muted:#C8AFC9; --line:#4A3253;
    --heart:#FF79A6; --ok:#7EE2B8; --warn:#FF8FB0; --shadow:0 6px 0 #1A0F1E;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:17px/1.55 "Nunito", ui-rounded, system-ui, -apple-system, sans-serif; font-weight:500;
  -webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--pink) 22%, transparent) 0 120px, transparent 121px),
                   radial-gradient(circle at 95% 30%, color-mix(in srgb, var(--lilac) 20%, transparent) 0 90px, transparent 91px);
  background-attachment:fixed;
}
main{max-width:34rem; margin:0 auto; padding:1rem 1.1rem 3rem}
.display{font-family:"Fredoka", ui-rounded, system-ui, sans-serif}

/* Header */
.hero{text-align:center; padding-top:.5rem}
.hero svg{width:min(220px,60vw); height:auto; display:block; margin:0 auto}
.hero h1{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:2.3rem; line-height:1.05; margin:.4rem 0 .5rem; color:var(--ink)}
.hero p{color:var(--muted); margin:0 auto 1.25rem; max-width:28rem}
.meter{display:flex; justify-content:center; gap:3px; margin:0 0 1.25rem; flex-wrap:wrap}
.meter svg{width:20px; height:20px}

/* Grid */
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem}
.grid > .tile:last-child:nth-child(3n+1){grid-column:2}
.tile{
  position:relative; aspect-ratio:1/1.12; border:0; border-radius:22px; padding:.5rem .4rem .55rem; margin:0;
  font:inherit; color:var(--tile-ink); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center;
  box-shadow:0 5px 0 color-mix(in srgb, var(--c) 60%, #3A2140);
  background:var(--c); transition:transform .15s ease;
}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.tile .ic{width:66%; flex:1; display:flex; align-items:center; justify-content:center}
.tile .ic svg{width:100%; height:auto; max-height:100%}
.tile .nm{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:.82rem; line-height:1.1}
.tile.soon{opacity:.5; filter:saturate(.55); cursor:default; box-shadow:0 5px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.tile.soon:active{transform:none}
.tile .tag{
  position:absolute; top:-6px; right:-4px; background:var(--card); color:var(--ink);
  font-size:.68rem; font-weight:800; padding:.1rem .45rem; border-radius:999px; border:2px solid var(--c);
}
.tile .badge{position:absolute; top:-10px; right:-8px; width:40px; height:40px}
.tile .badge svg{width:100%; height:100%}
.tile .badge span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:3px;
  color:#fff; font-family:"Fredoka", sans-serif; font-weight:700; font-size:.85rem}

/* Final */
.final{margin-top:2rem; background:var(--card); border-radius:26px; padding:1.3rem 1.1rem 1.4rem; box-shadow:var(--shadow); text-align:center; border:2px solid var(--line)}
.final h2{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:1.45rem; margin:0}
.final .sub{color:var(--muted); margin:.25rem 0 1rem; white-space:pre-line}
.slots{display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem}
.slot{position:relative; aspect-ratio:1; min-width:0}
.slot svg, .meter svg{display:block}
.slot svg{width:100%; height:100%}
.slot span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:12%;
  font-family:"Fredoka", sans-serif; font-weight:700; font-size:.9rem; color:#fff; word-break:break-word; line-height:1}
.big{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1.5rem; line-height:1.3; white-space:pre-line; margin:1.1rem 0 0; color:var(--heart)}

/* Place view */
.back{font:inherit; font-weight:800; background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:999px; padding:.4rem .9rem; cursor:pointer}
.phead{text-align:center; margin-top:1rem}
.bubble{width:150px; height:150px; border-radius:50%; background:var(--c); margin:0 auto; display:flex; align-items:center; justify-content:center;
  box-shadow:0 7px 0 color-mix(in srgb, var(--c) 60%, #3A2140)}
.bubble svg{width:62%; height:auto}
.phead h1{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:700; font-size:2rem; margin:1rem 0 0; line-height:1.1}
.card{background:var(--card); border-radius:24px; padding:1.25rem 1.15rem; margin-top:1.1rem; box-shadow:var(--shadow); border:2px solid var(--line)}
.card h2{font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1rem; color:var(--heart); margin:0 0 .4rem}
.text{font-size:1.2rem; line-height:1.45; white-space:pre-line; margin:0; font-weight:700}
.reveal{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0; transform:scale(.85)} to{opacity:1; transform:none}}

button.primary{
  font:inherit; font-family:"Fredoka", ui-rounded, sans-serif; font-weight:600; font-size:1.1rem;
  width:100%; border:0; border-radius:18px; padding:.95rem; margin-top:1.1rem; cursor:pointer;
  background:var(--heart); color:#fff; box-shadow:0 5px 0 color-mix(in srgb, var(--heart) 60%, #3A2140);
}
button.primary:active{transform:translateY(3px); box-shadow:0 2px 0 color-mix(in srgb, var(--heart) 60%, #3A2140)}
button.primary:disabled{opacity:.6}
button.ghost{font:inherit; width:100%; background:transparent; color:var(--muted); border:2px dashed var(--line); border-radius:16px; padding:.75rem; margin-top:.7rem; cursor:pointer}
input[type=text]{
  font:inherit; font-weight:700; width:100%; margin-top:1rem; padding:.85rem 1rem; border-radius:16px;
  border:2px solid var(--line); background:var(--bg); color:var(--ink);
}
input[type=text]:focus{border-color:var(--heart); outline:none}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.status{min-height:1.5rem; margin:.8rem 0 0; color:var(--muted); font-weight:700}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.prizeCard{text-align:center}
.choices{list-style:none; padding:0; margin:1rem 0 0; display:grid; gap:.5rem}
.choiceBtn{font:inherit; font-weight:800; font-size:1.05rem; color:var(--ink); width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:.65rem; background:var(--bg); border:2px solid var(--line); border-radius:18px; padding:.9rem 1rem;
  box-shadow:0 4px 0 var(--line)}
.choiceBtn::after{content:"›"; margin-left:auto; font-size:1.4rem; line-height:1; color:var(--heart)}
.choiceBtn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.choiceBtn::before{content:""; width:14px; height:13px; flex:none; background:var(--heart);
  clip-path:path("M7 13 C2 9.5 0 7 0.6 4.4 C1.2 1.6 4.6 1 7 3.6 C9.4 1 12.8 1.6 13.4 4.4 C14 7 12 9.5 7 13 Z")}
.where{color:var(--muted); font-weight:700; margin:.15rem 0 0}
.pieceHeart{position:relative; width:110px; height:100px; margin:.5rem auto 0}
.pieceHeart svg{width:100%; height:100%}
.pieceHeart span{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding-bottom:12px;
  font-family:"Fredoka", sans-serif; font-weight:700; font-size:1.9rem; color:#fff}

/* Heart burst */
.burst{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.burst i{position:absolute; bottom:-40px; width:26px; height:24px; animation:float 2.2s ease-out forwards}
.burst i svg{width:100%; height:100%}
@keyframes float{
  0%{transform:translateY(0) rotate(0) scale(.6); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-105vh) rotate(var(--r)) scale(1.1); opacity:0}
}

.test{margin-top:2rem; padding-top:1rem; border-top:2px dashed var(--warn); text-align:center}
.test p{color:var(--warn); margin:0; font-size:.9rem; font-weight:700}
@media (prefers-reduced-motion: reduce){ .reveal{animation:none} .burst{display:none} .tile{transition:none} }
</style>
</head>

    <path d="M10 19 L32 36 L54 19" fill="none" ${S}/>
    <path d="M32 46 C24 41 22 37 24 34.5 C26 32 30 33 32 36 C34 33 38 32 40 34.5 C42 37 40 41 32 46 Z" fill="#FF4F8B" ${S} stroke-width="2"/>
    <path d="M50 8 l1.5 -4 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 Z" fill="#FFDB75" ${S} stroke-width="1.8"/></svg>`,
  lighthouse: `<svg viewBox="0 0 64 64"><path d="M4 56 C14 52 22 58 32 55 C42 52 50 58 60 55 V60 H4 Z" fill="#9DD2FF" ${S}/>
    <path d="M24 54 L27 22 H37 L40 54 Z" fill="#fff" ${S}/>
    <path d="M25.6 38 H38.4 L39.2 46 H24.8 Z" fill="#FF8FB8" ${S} stroke-width="2"/>
    <path d="M26.4 30 H37.6" fill="none" ${S} stroke-width="2"/>
    <rect x="25" y="13" width="14" height="9" rx="2" fill="#FFDB75" ${S}/>
    <path d="M24 13 L32 6 L40 13 Z" fill="#FF4F8B" ${S}/>
    <path d="M14 15 L22 17 M14 21 L22 19 M50 15 L42 17 M50 21 L42 19" ${S} stroke="#FFB894" stroke-width="2.4"/>
    ${eyes(29,35,51)}<path d="M30 54 q2 1.6 4 0" fill="none" ${S} stroke-width="1.8"/></svg>`,
  gift: `<svg viewBox="0 0 64 64"><rect x="10" y="26" width="44" height="30" rx="5" fill="#C4B0FF" ${S}/>
    <rect x="7" y="18" width="50" height="10" rx="4" fill="#FF8FB8" ${S}/><path d="M32 18 V56" ${S}/>
    <path d="M32 18 C24 6 14 12 20 18 M32 18 C40 6 50 12 44 18" fill="none" ${S}/></svg>`,
  star: `<svg viewBox="0 0 64 64"><path d="M32 6 L39 22 L56 24 L43 36 L47 54 L32 45 L17 54 L21 36 L8 24 L25 22 Z" fill="#FFDB75" ${S}/>
    ${eyes(27,37,30)}${cheeks(23,41,35)}${smile(32,35,3)}</svg>`
};
const heart = (fill, stroke = "#3A2140", sw = 2.6, dashed = false) =>
  `<svg viewBox="0 0 64 64"><path d="${heartPath}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${dashed ? 'stroke-dasharray="5 5"' : ''}/></svg>`;

const MASCOTS = `<svg viewBox="0 0 240 150" aria-hidden="true">
  <ellipse cx="120" cy="140" rx="96" ry="7" fill="#3A2140" opacity=".08"/>
  <path d="M28 138 C18 100 30 58 70 56 C110 54 116 100 108 138 Z" fill="#FF8FB8" ${S}/>
  <path d="M212 138 C222 100 210 58 170 56 C130 54 124 100 132 138 Z" fill="#C4B0FF" ${S}/>
  ${eyes(58,82,92)}${cheeks(50,90,102)}<path d="M64 100 q6 6 12 0" fill="none" ${S}/>
  ${eyes(158,182,92)}${cheeks(150,190,102)}<path d="M164 100 q6 6 12 0" fill="none" ${S}/>
  <path d="M104 112 C116 108 124 108 136 112" fill="none" ${S}/>
  <path d="M120 70 C96 54 92 40 100 32 C108 24 118 28 120 36 C122 28 132 24 140 32 C148 40 144 54 120 70 Z" fill="#FF4F8B" ${S}/>
  <path d="M106 40 q2 -5 7 -6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M40 30 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 Z" fill="#FFDB75" ${S} stroke-width="2"/>
  <path d="M196 24 l2.5 -6 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 Z" fill="#8FDFC5" ${S} stroke-width="2"/>
</svg>`;
const COLORS = ["var(--pink)","var(--mint)","var(--butter)","var(--lilac)","var(--sky)","var(--peach)"];
const BURST = ["#FF4F8B","#FF8FB8","#C4B0FF","#FFDB75","#8FDFC5","#9DD2FF"];

/* ---------- App ---------- */
const KEY = "hunt-grid-v1";
const TEST = new URLSearchParams(location.search).has("test");
const P = HUNT.places;

function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.arrived) return s; } catch(e){}
  return { arrived: [], solved: [], finalSolved: false };
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

let state = load();
let view = null;
let sub = null;   // chosen spot index while browsing a place with choices
let flash = null;

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
const has = (arr, i) => arr.includes(i);
const colorOf = i => COLORS[i % COLORS.length];
function chosenIdx(i){ const c = state.chosen ? state.chosen[i] : null; return P[i].choices && c != null ? c : null; }
function chosen(i){ const c = chosenIdx(i); return c != null ? P[i].choices[c] : null; }


function metres(lat1, lng1, lat2, lng2){
  const R = 6371000, r = x => x * Math.PI / 180;
  const a = Math.sin(r(lat2-lat1)/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function pretty(m){
  const ft = m * 3.28084;
  return ft < 1000 ? Math.round(ft/50)*50 + " ft" : (m/1609.34).toFixed(1) + " mi";
}
function el(tag, attrs = {}, text){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}
function art(html, cls){ const d = el("div", cls ? {class:cls, "aria-hidden":"true"} : {"aria-hidden":"true"}); d.innerHTML = html; return d; }
function setStatus(msg, kind){
  const s = document.getElementById("status");
  if (s){ s.textContent = msg; s.className = "status" + (kind ? " " + kind : ""); }
}
function go(v, c = null){ view = v; sub = c; render(); window.scrollTo(0, 0); }

function burst(n = 26){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b = el("div", {class:"burst"});
  for (let k = 0; k < n; k++){
    const i = el("i");
    i.innerHTML = heart(BURST[k % BURST.length], "none", 0);
    i.style.left = (Math.random() * 100) + "vw";
    i.style.animationDelay = (Math.random() * .6) + "s";
    i.style.setProperty("--r", (Math.random() * 120 - 60) + "deg");
    const sz = 16 + Math.random() * 22; i.style.width = sz + "px"; i.style.height = sz + "px";
    b.append(i);
  }
  document.body.append(b);
  setTimeout(() => b.remove(), 3200);
}

/* Grid */
function renderGrid(app){
  document.title = HUNT.title;
  const hero = el("header", {class:"hero"});
  hero.append(art(MASCOTS));
  hero.append(el("h1", {}, HUNT.title));
  hero.append(el("p", {}, HUNT.intro));
  const meter = el("div", {class:"meter", role:"img", "aria-label": state.solved.length + " of " + P.length + " pieces collected"});
  P.forEach((_, i) => meter.append(art(has(state.solved, i) ? heart("#FF4F8B", "#3A2140", 3) : heart("none", "#C8AFC9", 3, true))));
  hero.append(meter);
  app.append(hero);

  const grid = el("div", {class:"grid"});
  P.forEach((p, i) => {
    const solved = has(state.solved, i), arrived = has(state.arrived, i);
    if (p.soon){
      const t = el("button", {type:"button", class:"tile soon", "aria-label":"Coming soon", "aria-disabled":"true"});
      t.style.setProperty("--c", colorOf(i));
      t.append(art(ICONS.mystery, "ic"), el("span", {class:"nm"}, "Coming Soon"));
      grid.append(t);
      return;
    }
    const t = el("button", {type:"button", class:"tile" + (solved ? " solved" : arrived ? " open" : " todo")});
    t.style.setProperty("--c", colorOf(i));
    t.append(art(ICONS[p.icon] || ICONS.star, "ic"));
    t.append(el("span", {class:"nm"}, p.name));
    if (solved){
      const b = art(heart("#FF4F8B", "#fff", 4), "badge");
      b.append(el("span", {}, p.piece)); t.append(b);
    } else if (arrived){
      t.append(el("span", {class:"tag"}, "Puzzle!"));
    }
    t.setAttribute("aria-label", p.name + ", " + (solved ? "solved" : arrived ? "puzzle open" : "not visited yet"));
    t.addEventListener("click", () => go(i));
    grid.append(t);
  });
  app.append(grid);

  const done = state.solved.length;
  const f = el("section", {class:"final"});
  f.append(el("h2", {}, "The big surprise"));
  f.append(el("p", {class:"sub"}, done < P.length ? done + " of " + P.length + " pieces collected" : HUNT.finalPuzzle.prompt));
  const slots = el("div", {class:"slots"});
  P.forEach((p, i) => {
    const got = has(state.solved, i);
    const s = art(got ? heart(BURST[i % BURST.length], "#3A2140", 2.6) : heart("none", "#E8C9D8", 2.6, true), "slot");
    if (got) s.append(el("span", {}, p.piece));
    slots.append(s);
  });
  f.append(slots);

  if (done === P.length){
    const needsAnswer = HUNT.finalPuzzle.answers.length > 0;
    if (!needsAnswer || state.finalSolved){
      f.append(el("p", {class:"big" + (flash === "final" ? " reveal" : "")}, HUNT.finalPuzzle.reveal));
    } else {
      const inp = el("input", {type:"text", placeholder:"Your answer", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Final answer"});
      const b = el("button", {type:"button", class:"primary"}, "Check answer");
      const submit = () => {
        if (!inp.value.trim()) return;
        if (HUNT.finalPuzzle.answers.some(a => norm(a) === norm(inp.value))){
          state.finalSolved = true; save(); flash = "final"; render(); burst(40);
        } else setStatus("So close! Try again.", "warn");
      };
      b.addEventListener("click", submit);
      inp.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
      f.append(inp, b, el("p", {class:"status", id:"status"}));
    }
  }
  app.append(f);

  if (TEST){
    const t = el("section", {class:"test"});
    t.append(el("p", {}, "Test mode is on (remove ?test from the link before sharing)."));
    const r = el("button", {type:"button", class:"ghost"}, "Reset all progress");
    r.addEventListener("click", () => { state = {arrived:[], solved:[], finalSolved:false, chosen:{}}; save(); render(); });
    t.append(r);
    app.append(t);
  }
}

/* One place */
function backBtn(label, fn){
  const b = el("button", {type:"button", class:"back"}, label);
  b.addEventListener("click", fn);
  return b;
}
function placeHead(i, title, subtitle){
  const head = el("header", {class:"phead"});
  const bub = art(ICONS[P[i].icon] || ICONS.star, "bubble");
  bub.style.setProperty("--c", colorOf(i));
  head.append(bub, el("h1", {}, title));
  if (subtitle) head.append(el("p", {class:"where"}, subtitle));
  return head;
}

function renderPlace(app, i){
  const p = P[i];
  const solved = has(state.solved, i), arrived = has(state.arrived, i);
  const c = p.choices ? (chosenIdx(i) != null ? chosenIdx(i) : sub) : null;

  // Choice menu
  if (p.choices && c == null){
    document.title = p.name + " · " + HUNT.title;
    app.append(backBtn("‹ All places", () => go(null)));
    app.append(placeHead(i, p.name));
    const card = el("section", {class:"card"});
    card.append(el("p", {class:"text"}, "Your choice! Which spot are you visiting?"));
    const ul = el("ul", {class:"choices"});
    p.choices.forEach((ch, k) => {
      const li = el("li");
      const btn = el("button", {type:"button", class:"choiceBtn"}, ch.name);
      btn.addEventListener("click", () => go(i, k));
      li.append(btn); ul.append(li);
    });
    card.append(ul);
    app.append(card);
    return;
  }

  const spot = c != null ? p.choices[c] : null;
  const e = spot ? Object.assign({}, p, spot, {name: p.name}) : p;
  document.title = (spot ? spot.name : p.name) + " · " + HUNT.title;
  if (spot && !arrived) app.append(backBtn("‹ " + p.name, () => go(i, null)));
  else app.append(backBtn("‹ All places", () => go(null)));
  app.append(placeHead(i, spot ? spot.name : p.name, spot ? p.name : null));

  if (!arrived){
    const card = el("section", {class:"card"});
    card.append(el("p", {class:"text"}, "Come find me here to open this puzzle!"));
    const b = el("button", {type:"button", class:"primary", id:"check"}, "I’m here! Check my location");
    b.addEventListener("click", () => check(i, c));
    card.append(b, el("p", {class:"status", id:"status"}));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: open without GPS");
      u.addEventListener("click", () => arrive(i, c));
      card.append(u);
    }
    app.append(card);
    return;
  }

  const card = el("section", {class:"card" + (flash === "arrive" ? " reveal" : "")});
  card.append(el("h2", {}, "Your puzzle"));
  card.append(el("p", {class:"text"}, e.puzzle));
  if (!solved){
    const inp = el("input", {type:"text", placeholder:"Your answer", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Answer"});
    const b = el("button", {type:"button", class:"primary"}, "Check answer");
    const submit = () => {
      if (!inp.value.trim()) return;
      if ((e.answers || []).some(a => norm(a) === norm(inp.value))) solve(i);
      else setStatus("So close! Try again.", "warn");
    };
    b.addEventListener("click", submit);
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") submit(); });
    card.append(inp, b, el("p", {class:"status", id:"status"}));
    if (TEST){
      const u = el("button", {type:"button", class:"ghost"}, "Test: mark solved");
      u.addEventListener("click", () => solve(i));
      card.append(u);
    }
  }
  app.append(card);

  if (solved){
    const pr = el("section", {class:"card prizeCard" + (flash === "solve" ? " reveal" : "")});
    pr.append(el("h2", {}, "Your prize"));
    pr.append(el("p", {class:"text"}, e.prize));
    pr.append(el("h2", {style:"margin-top:1.3rem"}, "Your piece of the big surprise"));
    const ph = art(heart("#FF4F8B", "#3A2140", 2.6), "pieceHeart");
    ph.append(el("span", {}, p.piece));
    pr.append(ph);
    app.append(pr);
  }
}

function render(){
  const app = document.getElementById("app");
  app.textContent = "";
  view === null ? renderGrid(app) : renderPlace(app, view);
  flash = null;
}

function arrive(i, c){
  if (c != null){ state.chosen = state.chosen || {}; state.chosen[i] = c; }
  if (!has(state.arrived, i)) state.arrived.push(i);
  save(); flash = "arrive"; render();
}
function solve(i){
  if (!has(state.arrived, i)) state.arrived.push(i);
  if (!has(state.solved, i)) state.solved.push(i);
  save(); flash = "solve"; render(); burst();
}

function check(i, c){
  const p = P[i], btn = document.getElementById("check");
  const t = c != null ? p.choices[c] : p;
  if (t.lat == null || t.lng == null){ setStatus("This place doesn’t have a location set yet.", "warn"); return; }
  if (!("geolocation" in navigator)){ setStatus("This browser can’t share location. Try Safari or Chrome on your phone.", "warn"); return; }
  btn.disabled = true; setStatus("Finding you…");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false;
    const d = metres(pos.coords.latitude, pos.coords.longitude, t.lat, t.lng);
    const slack = Math.min(pos.coords.accuracy || 0, 50);
    if (d <= t.radius + slack){
      setStatus("You made it!", "ok");
      setTimeout(() => arrive(i, c), 600);
    } else {
      let msg = HUNT.showDistance ? "Not quite there! You’re about " + pretty(d) + " away." : "Not quite there yet!";
      if (pos.coords.accuracy > 150) msg += " Your GPS signal is weak, so step outside and try again.";
      setStatus(msg, "warn");
    }
  }, err => {
    btn.disabled = false;
    if (err.code === 1) setStatus("Location is turned off for this page. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using. Then reload and try again.", "warn");
    else if (err.code === 3) setStatus("That took too long. Step outside for a clearer signal and try again.", "warn");
    else setStatus("Couldn’t get your location. Check that Location Services is on and try again.", "warn");
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}

render();
</script>
