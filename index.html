          return `<g filter="url(#mcCarve)" font-family="Georgia, 'Times New Roman', serif" font-size="27" letter-spacing="3" text-anchor="middle">
            <text x="83" y="${y + 1.3}" fill="#B8976B" opacity=".6">${w}</text>
            <text x="83" y="${y}" fill="#1E1209" opacity="1">${w}</text></g>`; }).join("")}
        <circle cx="11" cy="29" r="2.2" fill="#140E0A"/><circle cx="155" cy="29" r="2.2" fill="#140E0A"/>
        <rect x="0" y="20" width="166" height="84" rx="3" fill="url(#mcWet)"/>
        <rect x="0" y="20" width="166" height="84" rx="3" fill="url(#mcFire)"/>
      </g>
    </svg>
  </div>`;
  const svg = wrap.firstElementChild;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) svg.querySelectorAll("animate").forEach(a => a.remove());
  const blanks = el("p", {class:"mcBlanks", "aria-label": "The message has " + words.map(w => w.length).join(" and ") + " letters"},
    words.map(w => "_ ".repeat(w.length).trim()).join("   "));
  const inp = el("input", {type:"text", placeholder:"The message", autocomplete:"off", autocapitalize:"characters", spellcheck:"false", "aria-label":"The blinking message"});
  const bGo = el("button", {type:"button", class:"primary"}, "Check message");
  const msg = el("p", {class:"status", role:"status"});
  wrap.append(blanks, inp, bGo, msg);
  root.append(wrap);

  const unit = 340;   // ms per Morse unit; no pause or speed buttons, to keep the blink a secret
  let k = -1, timer, done = false, seen = false;
  const light = on => svg.classList.toggle("on", on);
  function tick(){
    if (wrap.isConnected) seen = true; else if (seen) return;   // stop once the page moves on
    if (done) return;
    k = (k + 1) % seq.length;
    light(seq[k][0]);
    timer = setTimeout(tick, seq[k][1] * unit);
  }
  const check = () => {
    if (done || !inp.value.trim()) return;
    if (norm(inp.value) === norm(game.message)){
      done = true; clearTimeout(timer); light(true); inp.disabled = bGo.disabled = true;
      flashMsg(msg, "Message received! 💕", "ok");
      setTimeout(onWin, 1400);
    } else flashMsg(msg, "Not quite. Keep watching the window.", "warn");
  };
  bGo.addEventListener("click", check);
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
  light(false); timer = setTimeout(tick, 1200);
}

/* Reflection: a mountain lake at dawn. The message isn't on the shore at all;
   it only shows up upside down in the rippling water. */
function reflection(root, game, onWin){
  const lines = [].concat(game.message).map(l => String(l).toUpperCase());
  const words = lines.join(" ").split(/\s+/).filter(Boolean);
  const W = 360, H = 480, SHORE = 222;
  // Pines: stacked triangles with a little jitter so no two look alike
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pine = (x, base, h, fill) => {
    const w = h * .34; let d = "";
    for (let t = 0; t < 4; t++){
      const top = base - h + t * h * .2, bot = top + h * .42, ww = w * (.45 + t * .2);
      d += `M${x} ${top}L${x + ww} ${bot}L${x - ww} ${bot}Z`;
    }
    return `<path d="${d}" fill="${fill}"/><rect x="${x - 1.2}" y="${base - h * .12}" width="2.4" height="${h * .12}" fill="#2A2B22"/>`;
  };
  let far = "", near = "";
  for (let x = -6; x < W + 10; x += 9 + rnd() * 7) far += pine(x, SHORE - 2 + rnd() * 3, 22 + rnd() * 16, "#3F5E50");
  [[14, 120], [44, 86], [70, 64], [302, 70], [332, 104], [354, 132]].forEach(([x, h]) => near += pine(x, SHORE + 4, h, "#22382E"));
  const land = `
    <path d="M0 150 L38 118 L70 128 L112 82 L150 104 L178 92 L214 58 L250 96 L286 84 L322 116 L360 104 L360 ${SHORE} L0 ${SHORE}Z" fill="#9FB2BC"/>
    <path d="M214 58 L236 82 L226 88 L214 76 L200 80Z M112 82 L126 96 L116 98Z" fill="#F4F6F4" opacity=".9"/>
    <path d="M0 176 L54 150 L98 166 L140 146 L196 170 L246 150 L300 168 L360 154 L360 ${SHORE} L0 ${SHORE}Z" fill="#7F949C"/>
    ${far}${near}`;
  const lineY = (k) => SHORE + 70 + k * 54;
  const wrap = el("div", {class:"rf"});
  wrap.innerHTML = `
  <div class="rfScene">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A still mountain lake ringed by pines and granite peaks">
      <defs>
        <linearGradient id="rfSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9EC3DA"/><stop offset=".7" stop-color="#F2D9BD"/><stop offset="1" stop-color="#F7E6CF"/>
        </linearGradient>
        <linearGradient id="rfWater" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8FAFBC"/><stop offset=".45" stop-color="#4F7A89"/><stop offset="1" stop-color="#244653"/>
        </linearGradient>
        <linearGradient id="rfFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/>
        </linearGradient>
        <mask id="rfFadeMask" maskUnits="userSpaceOnUse" x="0" y="${SHORE}" width="${W}" height="${H - SHORE}">
          <rect x="0" y="${SHORE}" width="${W}" height="${H - SHORE}" fill="url(#rfFade)"/>
        </mask>
        <clipPath id="rfWaterClip"><rect x="0" y="${SHORE}" width="${W}" height="${H - SHORE}"/></clipPath>
        <filter id="rfRipple" filterUnits="userSpaceOnUse" x="-20" y="${SHORE - 20}" width="${W + 40}" height="${H - SHORE + 40}" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".006 .07" numOctaves="2" seed="3" result="n">
            <animate attributeName="baseFrequency" dur="9s" values=".006 .07; .008 .085; .006 .07" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="rfRippleSoft" filterUnits="userSpaceOnUse" x="-20" y="${SHORE - 20}" width="${W + 40}" height="${H - SHORE + 40}" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".01 .06" numOctaves="2" seed="11" result="n">
            <animate attributeName="baseFrequency" dur="7s" values=".01 .06; .012 .075; .01 .06" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feGaussianBlur in="d" stdDeviation=".5"/>
        </filter>
        <g id="rfLand">${land}</g>
      </defs>
      <rect width="${W}" height="${SHORE}" fill="url(#rfSky)"/>
      <circle cx="292" cy="62" r="15" fill="#FFF4DE" opacity=".85"/>
      <use href="#rfLand"/>
      <rect y="${SHORE}" width="${W}" height="${H - SHORE}" fill="url(#rfWater)"/>
      <g clip-path="url(#rfWaterClip)" filter="url(#rfRipple)" opacity=".5">
        <use href="#rfLand" transform="translate(0 ${SHORE * 2}) scale(1 -1)"/>
      </g>
      <g clip-path="url(#rfWaterClip)" filter="url(#rfRippleSoft)" mask="url(#rfFadeMask)">
        ${lines.map((l, k) => `<g transform="translate(${W / 2} ${lineY(k)}) scale(1 -1)">
          <text x="0" y="0" text-anchor="middle" font-family="Fredoka, ui-rounded, sans-serif" font-weight="600"
                font-size="${l.length > 9 ? 31 : 34}" letter-spacing="2" fill="#F3F7F5">${l}</text></g>`).join("")}
      </g>
      <rect y="${SHORE}" width="${W}" height="3" fill="#E9EFE6" opacity=".35"/>
      ${[[60, 260, 70], [210, 300, 90], [120, 360, 60], [250, 420, 80], [40, 446, 50]].map(([x, y, w], k) =>
        `<rect class="rfGlint" style="animation-delay:${-k * 1.3}s" x="${x}" y="${y}" width="${w}" height="1.6" rx=".8" fill="#FFFFFF"/>`).join("")}
    </svg>
  </div>`;
  const svg = wrap.querySelector("svg");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) svg.querySelectorAll("animate").forEach(a => a.remove());
  const blanks = el("p", {class:"mcBlanks rfBlanks", "aria-label": "The message has " + words.length + " words: " + words.map(w => w.length).join(", ") + " letters"});
  words.forEach(w => blanks.append(el("span", {"aria-hidden":"true"}, "_ ".repeat(w.length).trim())));
  const inp = el("input", {type:"text", placeholder:"What does the lake say?", autocomplete:"off", autocapitalize:"characters", spellcheck:"false", "aria-label":"The message in the water"});
  const bGo = el("button", {type:"button", class:"primary"}, "Check");
  const msg = el("p", {class:"status", role:"status"});
  wrap.append(blanks, inp, bGo, msg);
  root.append(wrap);

    if (done || !inp.value.trim()) return;

      done = true; inp.disabled = bGo.disabled = true; wrap.classList.add("calm");
      flashMsg(msg, "You read the water! 💕", "ok");
      setTimeout(onWin, 1600);
    } else flashMsg(msg, "Not quite. Look into the water a little longer.", "warn");
  };
  bGo.addEventListener("click", check);
  inp.addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
}

/* Spelling Bee game */
function spellingbee(root, game, onWin){
  const mid = game.center.toUpperCase();
  let outer = [...game.letters.toUpperCase()];
  const all = new Set([mid, ...outer]);
  const words = game.words.map(w => w.toUpperCase());
  const isPangram = w => [...all].every(ch => w.includes(ch));
  const pangrams = words.filter(isPangram);
  const goal = Math.min(game.goal || words.length, words.length);
  const found = [];
  let entry = "", over = false;

  const wrap = el("div", {class:"sb"});
  const prog = el("div", {class:"sbProg"});
  const entryBox = el("div", {class:"sbEntry", "aria-live":"polite"});
  const hive = el("div", {class:"sbHive", role:"group", "aria-label":"Letters"});
  const btns = el("div", {class:"sbBtns"});
  const bDel = el("button", {type:"button", class:"cxBtn"}, "Delete");
  const bShuf = el("button", {type:"button", class:"cxBtn", "aria-label":"Shuffle letters"}, "⟳");
  const bGo = el("button", {type:"button", class:"cxBtn"}, "Enter");
  btns.append(bDel, bShuf, bGo);
  const msg = el("p", {class:"status", role:"status"});
  const list = el("div", {class:"sbFound"});
  wrap.append(prog, entryBox, hive, btns, msg, list);
  root.append(wrap);

  // Centre hex plus six around it (positions as % of the hive box)
  const SPOTS = [[33.3, 35.6], [33.3, 6.7], [58.3, 21.1], [58.3, 50], [33.3, 64.4], [8.3, 50], [8.3, 21.1]];
  function drawHive(){
    hive.textContent = "";
    [mid, ...outer].forEach((ch, k) => {
      const b = el("button", {type:"button", class:"sbHex" + (k ? "" : " mid")}, ch);
      b.style.left = SPOTS[k][0] + "%"; b.style.top = SPOTS[k][1] + "%";
      b.addEventListener("click", () => add(ch));
      hive.append(b);
    });
  }
  function drawEntry(){
    entryBox.textContent = "";
    [...entry].forEach(ch => entryBox.append(el("span", {class: ch === mid ? "c" : ""}, ch)));
    entryBox.append(el("span", {class:"cursor"}));
  }
  function draw(){
    prog.textContent = "";
    prog.append(el("span", {class: found.length >= goal ? "ok" : ""}, found.length + " of " + goal + " words"));
    const pg = pangrams.filter(w => found.includes(w)).length;
    prog.append(el("span", {class: pg === pangrams.length ? "ok" : ""},
      pangrams.length > 1 ? "Pangrams: " + pg + " of " + pangrams.length : (pg ? "Pangram found ✓" : "Pangram: not yet")));
    list.textContent = "";
    list.append(el("h3", {}, "Your words"));
    if (!found.length) list.append(el("p", {}, "None yet. Every word needs the yellow letter!"));
    else {
      const ul = el("ul");
      [...found].sort().forEach(w => ul.append(el("li", {class: isPangram(w) ? "pg" : ""}, w[0] + w.slice(1).toLowerCase())));
      list.append(ul);
    }
    bDel.disabled = bShuf.disabled = bGo.disabled = over;
    drawEntry();
  }
  function add(ch){ if (over || entry.length >= 19) return; entry += ch; drawEntry(); }
  function del(){ if (over) return; entry = entry.slice(0, -1); drawEntry(); }
  function enter(){
    if (over || !entry) return;
    const w = entry;
    const bad = t => { flashMsg(msg, t, "warn"); entryBox.classList.remove("shake"); void entryBox.offsetWidth; entryBox.classList.add("shake"); setTimeout(() => { entry = ""; drawEntry(); }, 450); };
    if (w.length < 4) return bad("Too short. Words have at least 4 letters.");
    if (!w.includes(mid)) return bad("Missing the center letter, " + mid + ".");
    if ([...w].some(ch => !all.has(ch))) return bad("Only the letters in the hive count.");
    if (found.includes(w)) return bad("Already found!");
    if (!words.includes(w)) return bad("Not in my word list. Try another!");
    found.push(w); entry = "";
    flashMsg(msg, isPangram(w) ? "Pangram! 🌸 Every letter!" : ["Nice!", "Lovely!", "Great!", "Yes!"][found.length % 4], "ok");
    if (found.length >= goal && pangrams.every(p => found.includes(p))){
      over = true; draw(); flashMsg(msg, "You did it! 💕", "ok"); setTimeout(onWin, 1100); return;
    }
    if (found.length >= goal) flashMsg(msg, "That’s enough words! Now find the pangram, the word that uses every letter.", "ok");
    draw();
  }
  bDel.addEventListener("click", del);
  bGo.addEventListener("click", enter);
  bShuf.addEventListener("click", () => { for (let k = outer.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [outer[k], outer[j]] = [outer[j], outer[k]]; } drawHive(); });
  onKeys(wrap, ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); enter(); }
    else if (ev.key === "Backspace"){ ev.preventDefault(); del(); }
    else if (/^[a-z]$/i.test(ev.key) && all.has(ev.key.toUpperCase())) add(ev.key.toUpperCase());
  });
  drawHive(); draw();
}

/* Wordle game */
function wordle(root, game, onWin){
  const ans = game.answer.toUpperCase(), N = ans.length, TRIES = game.tries || 6;
  let rows, cur, over, keyState;
  const wrap = el("div", {class:"wd"});
  const grid = el("div", {class:"wdGrid", role:"grid", "aria-label":"Guesses"});
  const msg = el("p", {class:"status", role:"status"});
  const keys = el("div", {class:"wdKeys"});
  wrap.append(grid, msg, keys);
  root.append(wrap);
  const keyBtns = {};
  ["QWERTYUIOP", "ASDFGHJKL", "+ZXCVBNM-"].forEach(line => {
    const row = el("div");
    [...line].forEach(k => {
      const label = k === "+" ? "Enter" : k === "-" ? "⌫" : k;
      const b = el("button", {type:"button", class:"wdKey" + (k === "+" || k === "-" ? " wide" : ""), "aria-label": k === "-" ? "Delete" : label}, label);
      b.addEventListener("click", () => k === "+" ? enter() : k === "-" ? del() : add(k));
      if (k !== "+" && k !== "-") keyBtns[k] = b;
      row.append(b);
    });
    keys.append(row);
  });

  function score(g){   // g = green, y = yellow, x = grey (handles double letters)
    const res = Array(N).fill("x"), left = {};
    for (let k = 0; k < N; k++){ if (g[k] === ans[k]) res[k] = "g"; else left[ans[k]] = (left[ans[k]] || 0) + 1; }
    for (let k = 0; k < N; k++) if (res[k] !== "g" && left[g[k]]){ res[k] = "y"; left[g[k]]--; }
    return res;
  }
  function draw(flipRow){
    grid.textContent = "";
    for (let r = 0; r < TRIES; r++){
      const row = el("div", {class:"wdRow", role:"row"}); row.style.setProperty("--n", N);
      const done = rows[r] && rows[r].res, word = r === rows.length ? cur : rows[r] ? rows[r].word : "";
      for (let k = 0; k < N; k++){
        const ch = word[k] || "";
        const d = el("div", {class:"wdCell" + (done ? " " + rows[r].res[k] : ch ? " full" : "") + (done && r === flipRow ? " flip" : ""), role:"gridcell"}, ch);
        if (done && r === flipRow) d.style.animationDelay = (k * .12) + "s";
        row.append(d);
      }
      grid.append(row);
    }
    Object.entries(keyBtns).forEach(([k, b]) => { b.className = "wdKey" + (keyState[k] ? " " + keyState[k] : ""); b.disabled = over; });
  }
  function add(ch){ if (over || cur.length >= N) return; cur += ch; draw(); }
  function del(){ if (over) return; cur = cur.slice(0, -1); draw(); }
  function enter(){
    if (over) return;
    if (cur.length < N){ flashMsg(msg, "Not enough letters", "warn"); grid.children[rows.length].classList.add("shake"); setTimeout(() => grid.children[rows.length] && grid.children[rows.length].classList.remove("shake"), 400); return; }
    const res = score(cur), rank = {x:1, y:2, g:3};
    [...cur].forEach((ch, k) => { if (!keyState[ch] || rank[res[k]] > rank[keyState[ch]]) keyState[ch] = res[k]; });
    rows.push({word:cur, res}); const won = cur === ans; cur = "";
    draw(rows.length - 1);
    if (won){
      over = true; draw(rows.length - 1);
      setTimeout(() => flashMsg(msg, ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"][rows.length - 1] + " 💕", "ok"), N * 120 + 300);
      setTimeout(onWin, N * 120 + 1400);
    } else if (rows.length === TRIES){
      over = true; draw(rows.length - 1);
      setTimeout(() => {
        flashMsg(msg, "Out of tries! Have a sip of tea and try again.", "warn");
        const again = el("button", {type:"button", class:"primary"}, "Start over");
        again.addEventListener("click", () => { again.remove(); reset(); });
        wrap.append(again);
      }, N * 120 + 300);
    }
  }
  function reset(){ rows = []; cur = ""; over = false; keyState = {}; msg.textContent = ""; draw(); }
  onKeys(wrap, ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); enter(); }
    else if (ev.key === "Backspace"){ ev.preventDefault(); del(); }
    else if (/^[a-z]$/i.test(ev.key)) add(ev.key.toUpperCase());
  });
  reset();
}

/* Word ladder game: change one letter at a time, with a clue for each step */
function ladder(root, game, onWin){
  const L = game.ladders.map(l => ({start:l.start.toUpperCase(), end:l.end.toUpperCase(), title:l.title,
    rungs:l.rungs.map(r => ({word:r.word.toUpperCase(), clue:r.clue}))}));
  const at = L.map(() => 0);   // how many rungs solved in each ladder
  const wrap = el("div", {class:"ld"});
  root.append(wrap);
  const tiles = (word, cls, prev) => {
    const w = el("div", {class:"ldWord" + (cls ? " " + cls : ""), "aria-label": word});
    [...word].forEach((ch, k) => w.append(el("span", {class: prev && prev[k] !== ch ? "chg" : ""}, ch)));
    return w;
  };
  const diff = (a, b) => [...a].filter((ch, k) => ch !== b[k]).length;
  let focusNext = false;
  function draw(){
    wrap.textContent = "";
    L.forEach((l, n) => {
      const box = el("div", {class:"ldOne"});
      if (l.title) box.append(el("p", {class:"ldTitle"}, l.title));
      box.append(tiles(l.start, "end"));
      const unlocked = n === 0 || at[n - 1] === L[n - 1].rungs.length;
      l.rungs.forEach((r, k) => {
        const prevWord = k ? l.rungs[k - 1].word : l.start;
        const rung = el("div", {class:"ldRung"});
        if (k < at[n]){ rung.append(tiles(r.word, "done", prevWord), el("p", {class:"ldClue"}, r.clue)); }
        else if (k === at[n] && unlocked){
          rung.classList.add("on");
          rung.append(el("p", {class:"ldClue"}, r.clue));
          const inp = el("input", {type:"text", maxlength:String(r.word.length), autocomplete:"off", autocorrect:"off", autocapitalize:"characters", spellcheck:"false",
            "aria-label":"Word for: " + r.clue, placeholder:"?".repeat(r.word.length), enterkeyhint:"go"});
          const b = el("button", {type:"button", class:"cxBtn"}, "Check");
          const msg = el("p", {class:"status", role:"status"});
          const go = () => {
            const g = inp.value.replace(/[^a-z]/gi, "").toUpperCase();
            if (g.length !== r.word.length) return flashMsg(msg, "It’s a " + r.word.length + "-letter word.", "warn");
            if (diff(g, prevWord) !== 1) return flashMsg(msg, "Change exactly one letter of " + prevWord + ".", "warn");
            if (g !== r.word){ inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return flashMsg(msg, "Good try, but that’s not the one. Check the clue!", "warn"); }
            at[n]++; focusNext = true;
            if (at.every((v, j) => v === L[j].rungs.length)){ draw(); burst(10); setTimeout(onWin, 1200); }
            else draw();
          };
          b.addEventListener("click", go);
          inp.addEventListener("keydown", ev => { if (ev.key === "Enter") go(); });
          rung.append(inp, b, msg);
          if (focusNext){ focusNext = false; setTimeout(() => inp.focus({preventScroll:true}), 50); }
        } else {
          rung.classList.add("locked");
          rung.append(tiles("?".repeat(r.word.length)), el("p", {class:"ldClue"}, unlocked ? r.clue : "…"));
        }
        box.append(rung);
      });
      box.append(tiles(l.end, "end", at[n] === l.rungs.length ? l.rungs[l.rungs.length - 1].word : null));
      wrap.append(box);
    });
  }
  draw();
}

function render(){
  const app = document.getElementById("app");
  app.textContent = "";
  view === null ? renderGrid(app) : renderPlace(app, view);
  flash = null;
}

function arrive(i, c){
  if (c === "zone"){ markStep("zone" + i, "in"); flash = "arrive"; render(); return; }
  if (c != null && !spotOpen(i, c)) state.spotArrived.push(spotKey(i, c));
  if (!has(state.arrived, i)) state.arrived.push(i);
  save(); flash = "arrive"; render();
}
function solve(i, c){
  if (c != null){
    if (!spotOpen(i, c)) state.spotArrived.push(spotKey(i, c));
    if (!spotDone(i, c)) state.spotSolved.push(spotKey(i, c));
  }
  if (!has(state.arrived, i)) state.arrived.push(i);
  if (!has(state.solved, i)) state.solved.push(i);
  save(); flash = "solve"; render(); confetti();
}

function check(i, c){
  const p = P[i], btn = document.getElementById("check");
  const t = c === "zone" ? p.zone : c != null ? p.choices[c] : p;
  if (t.lat == null || t.lng == null){ setStatus("This place doesn’t have a location set yet.", "warn"); return; }
  if (!("geolocation" in navigator)){ setStatus("This browser can’t share location. Try Safari or Chrome on your phone.", "warn"); return; }
  btn.disabled = true; setStatus("Finding you…");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.disabled = false;
    const d = metres(pos.coords.latitude, pos.coords.longitude, t.lat, t.lng);
    const slack = Math.min(pos.coords.accuracy || 0, 50);
    if (d <= t.radius + slack){
      setStatus("You made it!", "ok");
      setTimeout(() => arrive(i, c), 600);
    } else {
      let msg = HUNT.showDistance ? "Not quite there! You’re about " + pretty(d) + " away." : "Not quite there yet!";
      if (pos.coords.accuracy > 150) msg += " Your GPS signal is weak, so step outside and try again.";
      setStatus(msg, "warn");
    }
  }, err => {
    btn.disabled = false;
    if (err.code === 1) setStatus("Location is turned off for this page. On iPhone: Settings › Privacy & Security › Location Services › Safari Websites › While Using. Then reload and try again.", "warn");
    else if (err.code === 3) setStatus("That took too long. Step outside for a clearer signal and try again.", "warn");
    else setStatus("Couldn’t get your location. Check that Location Services is on and try again.", "warn");
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
}

/* Welcome cloud: shown each visit until they tick "Don't show this again" */
const WELCOME_KEY = "hunt-welcome-hidden";
function showWelcome(){
  const w = HUNT.welcome;
  if (!w || document.querySelector(".wcBack")) return;
  try { if (localStorage.getItem(WELCOME_KEY) === "1") return; } catch(e){}
  const back = el("div", {class:"wcBack", role:"dialog", "aria-modal":"true", "aria-labelledby":"wcTitle"});
  const cloud = el("div", {class:"wcCloud"});
  ["a", "b", "c", "d", "e", "f", "g", "h", "i"].forEach(p => cloud.append(el("div", {class:"wcPuff " + p, "aria-hidden":"true"})));
  const body = el("div", {class:"wcBody"});
  body.append(art(heart("#FF4F8B", "#3A2140", 3), "wcHeart"), el("h2", {id:"wcTitle"}, w.title));
  w.paragraphs.forEach(t => body.append(el("p", {}, t)));
  const lab = el("label", {class:"wcCheck"});
  const box = el("input", {type:"checkbox"});
  lab.append(box, el("span", {}, w.dontShow));
  const go = el("button", {type:"button", class:"primary"}, w.button);
  const close = () => {
    try { if (box.checked) localStorage.setItem(WELCOME_KEY, "1"); } catch(e){}
    back.remove(); document.removeEventListener("keydown", esc);
  };
  const esc = ev => { if (ev.key === "Escape") close(); };
  go.addEventListener("click", close);
  document.addEventListener("keydown", esc);
  body.append(lab, go);
  cloud.append(body); back.append(cloud);
  document.body.append(back);
  go.focus({preventScroll:true});
}

render();
showWelcome();
pull();   // bring in progress saved on the server (does nothing in test mode or without the key)
addEventListener("online", () => { schedulePush(0); flushPhotos(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && dirty){ clearTimeout(pushTimer); push(); } });
